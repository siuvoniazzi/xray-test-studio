          state.lastSyncTime = formatClockTime();
        } catch (err) {
          setStatus('Created locally, folder write failed: ' + err.message, 'err');
        }
      }
      closeModal(`Created project "${proj.name}" (${proj.fileName})`);
    }

    async function renameProject(idx, nextName, nextJiraKey) {
      const proj = state.projects[idx];
      if (!proj) return;
      const cleanName = String(nextName || '').trim();
      if (!cleanName) return;
      proj.name = cleanName;
      proj.jiraProjectKey = String(nextJiraKey || '').trim().toUpperCase();
      proj.updatedAt = new Date().toISOString();
      persistWorkspaceLocalOnly();
      if (state.dirHandle) {
        await saveProjectToDirectory(state.dirHandle, proj, state.config, folderWriteQueue);
        state.syncStatus = 'saved';
        state.lastSyncTime = formatClockTime();
      }
      state.projectsModal.submode = 'list';
      setStatus(`Updated project "${proj.name}"`, 'ok');
      render(true);
    }

    async function duplicateProjectAt(idx) {
      const src = state.projects[idx];
      if (!src) return;
      const newName = src.name + ' Copy';
      const { id, fileName } = slugifyProjectName(newName, state.projects.map(p => p.fileName));
      const copy = {
        id,
        fileName,
        name: newName,
        jiraProjectKey: src.jiraProjectKey || '',
        updatedAt: new Date().toISOString(),
        tests: deepClone(src.tests || [])
      };
      state.projects.splice(idx + 1, 0, copy);
      state.projectsModal.idx = idx + 1;
      persistWorkspaceLocalOnly();
      if (state.dirHandle) {
        await saveProjectToDirectory(state.dirHandle, copy, state.config, folderWriteQueue);
        state.syncStatus = 'saved';
        state.lastSyncTime = formatClockTime();
      }
      setStatus(`Duplicated into "${copy.name}" (${copy.fileName})`, 'ok');
      render(true);
    }

    async function deleteProjectAt(idx) {
      if (state.projects.length <= 1) {
        setStatus('Workspace must keep at least 1 project', 'warn');
        render(true);
        return;
      }
      const removed = state.projects[idx];
      state.projects.splice(idx, 1);
      if (state.activeProjectIdx >= state.projects.length) {
        state.activeProjectIdx = state.projects.length - 1;
      } else if (idx < state.activeProjectIdx) {
        state.activeProjectIdx -= 1;
      }
      state.projectsModal.idx = Math.min(idx, state.projects.length - 1);
      state.activeTestIdx = 0;
      state.row = 0;
      state.col = 0;
      persistWorkspaceLocalOnly();
      if (state.dirHandle && removed) {
        try {
          await deleteProjectFromDirectory(state.dirHandle, removed, folderWriteQueue);
          state.syncStatus = 'saved';
          state.lastSyncTime = formatClockTime();
        } catch (err) {
          setStatus('Removed from workspace; file delete error: ' + err.message, 'warn');
          render(true);
          return;
        }
      }
      setStatus(`Deleted project "${removed.name}"`, 'warn');
      render(true);
    }

    function downloadActiveProjectJson() {
      const proj = activeProject();
      triggerDownload(proj.fileName, serializeProjectFile(proj), 'application/json');
      setStatus(`Downloaded ${proj.fileName}`, 'ok');
      render(false);
    }

    async function importProjectJsonFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const parsedProj = parseProjectFile(text, file.name);
        let newProj;
        if (parsedProj) {
          const { id, fileName } = slugifyProjectName(parsedProj.name, state.projects.map(p => p.fileName));
          newProj = Object.assign({}, parsedProj, {
            id: state.projects.some(p => p.fileName === parsedProj.fileName) ? id : parsedProj.id,
            fileName: state.projects.some(p => p.fileName === parsedProj.fileName) ? fileName : parsedProj.fileName,
            updatedAt: new Date().toISOString()
          });
        } else {
          const raw = JSON.parse(text);
          if (!Array.isArray(raw)) throw new Error('Expected a project JSON or test array.');
          const baseName = file.name.replace(/\.json$/i, '');
          const { id, fileName } = slugifyProjectName(baseName, state.projects.map(p => p.fileName));
          newProj = {
            id,
            fileName,
            name: baseName,
            jiraProjectKey: '',
            updatedAt: new Date().toISOString(),
            tests: raw
          };
        }
        state.projects.push(newProj);
        state.activeProjectIdx = state.projects.length - 1;
        state.projectsModal.idx = state.activeProjectIdx;
        state.activeTestIdx = 0;
        state.row = 0;
        state.col = 0;
        persistWorkspaceLocalOnly();
        if (state.dirHandle) {
          await saveProjectToDirectory(state.dirHandle, newProj, state.config, folderWriteQueue);
        }
        setStatus(`Added project "${newProj.name}"`, 'ok');
        render(true);
      } catch (err) {
        setStatus('Project import failed: ' + err.message, 'err');
        render(false);
      }
    }

    function activeTest() {
      return state.tests[state.activeTestIdx] || state.tests[0];
    }

    function clampCursor() {
      if (state.projects.length === 0) {
        state.projects = loadInitialProjects(state.config).projects;
      }
      state.activeProjectIdx = Math.max(0, Math.min(state.activeProjectIdx, state.projects.length - 1));
      if (state.tests.length === 0) {
        state.tests = makeDefaultTests(state.config);
      }
      state.activeTestIdx = Math.max(0, Math.min(state.activeTestIdx, state.tests.length - 1));
      const t = activeTest();
      if (!t.steps || t.steps.length === 0) t.steps = [{ action: '', data: '', expected: '' }];
      const cols = getEffectiveStepColumns(state.config, state.uiMode, t, state.simpleShowData);
      state.row = Math.max(0, Math.min(state.row, t.steps.length - 1));
      state.col = Math.max(0, Math.min(state.col, cols.length - 1));
    }

    function setStatus(msg, tone = '') {
      state.statusMsg = msg;
      state.statusTone = tone;
    }

    function setUiMode(mode) {
      const nextMode = mode === 'expert' ? 'expert' : 'simple';
      if (state.mode === 'edit') {
        commitCellEdit('stay');
      } else if (state.mode === 'summary' || state.mode === 'description' || state.mode === 'requirement' || state.mode === 'repoPath') {
        commitMetaEdit();
      }
      state.uiMode = nextMode;
      try { localStorage.setItem(STORAGE_UI_MODE_KEY, nextMode); } catch (_e) {}

      if (state.tour && state.tour.active && !state.tour.completed) {
        const activeSteps = getActiveTourSteps();
        const curStep = activeSteps[state.tour.stepIdx];
        if (curStep && curStep.event === 'toggle-mode') {
          notifyTourEvent('toggle-mode');
        } else if (state.tour.mode !== nextMode) {
          if (tourAdvanceTimer) { clearTimeout(tourAdvanceTimer); tourAdvanceTimer = null; }
          state.tour.active = false;
          state.tour.completed = false;
          state.tour.justCompletedStep = false;
        }
      }

      clampCursor();
      setStatus(
        nextMode === 'simple'
          ? 'Simple UI — focused on test cases & steps (press v for Expert)'
          : 'Expert UI — Xray metadata, AI Import & CSV Export unlocked (press v for Simple)',
        'ok'
      );
      render(state.mode !== 'modal');
    }

    function toggleSimpleDataColumn() {
      const t = activeTest();
      const hasAnyData = !!(t && Array.isArray(t.steps) && t.steps.some(s => String((s && s.data) || '').trim() !== ''));
      if (hasAnyData && state.simpleShowData) {
        setStatus('Test Data column stays visible while steps contain data', 'warn');
        render(true);
        return;
      }
      state.simpleShowData = !state.simpleShowData;
      clampCursor();
      setStatus(state.simpleShowData ? 'Showing Test Data column' : 'Hid optional Test Data column', 'ok');
      render(true);
    }

    /* --- Onboarding & Tour Runtime Controls --- */

    let tourAdvanceTimer = null;

    function getActiveTourSteps() {
      const mode = state.tour && state.tour.mode ? state.tour.mode : state.uiMode;
      return mode === 'simple' ? SIMPLE_TOUR_STEPS : TOUR_STEPS;
    }

    function markOnboarded() {
      try { localStorage.setItem(STORAGE_ONBOARDED_KEY, '1'); } catch (_e) {}
    }

    function dismissWelcome() {
      markOnboarded();
      closeModal(
        state.uiMode === 'simple'
          ? 'Simple UI ready — press Enter to write steps, or v for Expert mode'
          : 'Ready to author tests — press / or ? anytime for help'
      );
    }

    function chooseOnboardingMode(mode, startTour = false) {
      markOnboarded();
      state.mode = 'nav';
      state.modal = null;
      setUiMode(mode);
      if (startTour) startInteractiveTour();
    }

    function startInteractiveTour() {
      if (tourAdvanceTimer) { clearTimeout(tourAdvanceTimer); tourAdvanceTimer = null; }
      markOnboarded();
      state.tour = {
        active: true,
        mode: state.uiMode,
        stepIdx: 0,
        completed: false,
        subDone: {},
        justCompletedStep: false
      };
      state.mode = 'nav';
      state.modal = null;
      setStatus('Interactive Tour started — try the highlighted keys below', 'ok');
      render(true);
    }

    function exitTour() {
      if (tourAdvanceTimer) { clearTimeout(tourAdvanceTimer); tourAdvanceTimer = null; }
      state.tour.active = false;
      state.tour.completed = false;
      state.tour.justCompletedStep = false;
      renderTourOverlay();
      restoreFocus();
    }

    function stepTourManual(delta) {
      if (tourAdvanceTimer) { clearTimeout(tourAdvanceTimer); tourAdvanceTimer = null; }
      const steps = getActiveTourSteps();
      const nextIdx = state.tour.stepIdx + delta;
      if (nextIdx < 0) return;
      if (nextIdx >= steps.length) {
        state.tour.completed = true;
        state.tour.justCompletedStep = false;
      } else {
        state.tour.completed = false;
        state.tour.stepIdx = nextIdx;
        state.tour.subDone = {};
        state.tour.justCompletedStep = false;
      }
      renderTourOverlay();
      restoreFocus();
    }

    function notifyTourEvent(eventName) {
      if (!state.tour || !state.tour.active || state.tour.completed) return;
      const steps = getActiveTourSteps();
      const res = advanceTourState(state.tour, eventName, steps);
      if (res.nextTour === state.tour && !res.stepJustCompleted) return;

      if (!res.stepJustCompleted) {
        state.tour = res.nextTour;
        renderTourOverlay();
        return;
      }

      if (tourAdvanceTimer) clearTimeout(tourAdvanceTimer);
      state.tour.justCompletedStep = true;
      renderTourOverlay();
      tourAdvanceTimer = setTimeout(() => {
        tourAdvanceTimer = null;
        if (!state.tour.active) return;
        state.tour = res.nextTour;
        renderTourOverlay();
      }, 650);
    }

    function applyTourHighlight() {
      document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
      if (!state.tour || !state.tour.active || state.tour.completed) return;
      const steps = getActiveTourSteps();
      const step = steps[state.tour.stepIdx];
      if (!step || !step.target) return;
      document.querySelectorAll(`[data-tour-target="${step.target}"]`).forEach(el => el.classList.add('tour-highlight'));
    }

    function renderTourOverlay() {
      const container = document.getElementById('tour-overlay');
      if (!container) return;
      applyTourHighlight();

      if (!state.tour || !state.tour.active) {
        container.innerHTML = '';
        return;
      }

      const steps = getActiveTourSteps();

      if (state.tour.completed) {
        const isSimpleTour = steps === SIMPLE_TOUR_STEPS;
        container.innerHTML = `
          <aside class="tour-card" aria-label="Interactive Tutorial Complete">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <strong style="color:var(--success)">✓ You're Ready!</strong>
              <span class="mono muted" style="font-size:11px">${steps.length} / ${steps.length} complete</span>
            </div>
            <div class="tour-progress-bar"><div class="tour-progress-fill" style="width:100%;background:var(--success)"></div></div>
            <div class="muted">${isSimpleTour
              ? 'You\'ve got the core writing flow. Press <kbd>v</kbd> anytime to switch between Simple &amp; Expert UI, or <kbd>?</kbd> for shortcuts.'
              : 'You\'ve tried the core keyboard workflow. Press <kbd>/</kbd> anytime for the Command Palette or <kbd>?</kbd> for all shortcuts.'}</div>
            <div style="display:flex;justify-content:flex-end;gap:6px">
              <button type="button" tabindex="-1" onclick="startInteractiveTour()">Replay Tour</button>
              <button type="button" tabindex="-1" class="primary" onclick="exitTour()">Finish Tour</button>
            </div>
          </aside>
        `;
        return;
      }

      const step = steps[state.tour.stepIdx];
      const pct = Math.round(((state.tour.stepIdx + (state.tour.justCompletedStep ? 1 : 0)) / steps.length) * 100);
      const subHtml = Array.isArray(step.subTasks)
        ? `<div class="tour-sub">
             ${step.subTasks.map(st => {
               const done = !!state.tour.subDone[st.event];
               return `<div style="color:var(${done ? '--success' : '--text-muted'})"><span class="mono" style="font-weight:700">${done ? '[✓]' : '[ ]'}</span> ${escHtml(st.label)}</div>`;
             }).join('')}
           </div>`
        : '';

      container.innerHTML = `
        <aside class="tour-card" aria-label="Interactive Tutorial Step ${state.tour.stepIdx + 1}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span class="mono" style="font-size:11px;font-weight:700;color:var(--primary)">STEP ${state.tour.stepIdx + 1} OF ${steps.length}</span>
            ${state.tour.justCompletedStep
              ? `<span style="color:var(--success);font-weight:700;font-size:12px">✓ Nice!</span>`
              : `<button type="button" tabindex="-1" onclick="exitTour()" style="padding:2px 7px;font-size:11px">Exit Tour</button>`}
          </div>
          <div class="tour-progress-bar"><div class="tour-progress-fill" style="width:${pct}%"></div></div>
          <div style="font-weight:700;font-size:14px">${escHtml(step.title)}</div>
          <div class="muted">${escHtml(step.desc)}</div>
          ${subHtml}
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <div style="display:flex;gap:4px;flex-wrap:wrap">${step.keys.map(k => `<kbd>${escHtml(k)}</kbd>`).join('')}</div>
            <div style="display:flex;gap:5px">
              <button type="button" tabindex="-1" ${state.tour.stepIdx === 0 ? 'disabled' : ''} onclick="stepTourManual(-1)" style="padding:3px 8px">← Back</button>
              <button type="button" tabindex="-1" class="primary" onclick="stepTourManual(1)" style="padding:3px 8px">${state.tour.stepIdx === steps.length - 1 ? 'Finish' : 'Next →'}</button>
            </div>
          </div>
        </aside>
      `;
    }

    function checkFirstTimeOnboarding() {
      try {
        if (!localStorage.getItem(STORAGE_ONBOARDED_KEY)) {
          state.mode = 'modal';
          state.modal = 'welcome';
          render(true);
        }
      } catch (_e) {}
    }

    function pushUndo() {
      state.undoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      if (state.undoStack.length > 25) state.undoStack.shift();
      state.redoStack = [];
    }

    function undo() {
      if (state.undoStack.length === 0) {
        setStatus('Nothing to undo', 'warn');
        render(true);
        return;
      }
      const snap = state.undoStack.pop();
      const targetProjIdx = state.projects.findIndex(p => p.id === snap.projectId);
      if (targetProjIdx >= 0) state.activeProjectIdx = targetProjIdx;
      state.redoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      state.tests = snap.tests;
      state.config = snap.config;
      state.activeTestIdx = snap.activeTestIdx;
      state.row = snap.row;
      state.col = snap.col;
      state.mode = 'nav';
      state.modal = null;
      clampCursor();
      persistConfig();
      persistSuite();
      setStatus('Undid last change', 'ok');
      render(true);
    }

    function redo() {
      if (state.redoStack.length === 0) {
        setStatus('Nothing to redo', 'warn');
        render(true);
        return;
      }
      const snap = state.redoStack.pop();
      const targetProjIdx = state.projects.findIndex(p => p.id === snap.projectId);
      if (targetProjIdx >= 0) state.activeProjectIdx = targetProjIdx;
      state.undoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      state.tests = snap.tests;
      state.config = snap.config;
      state.activeTestIdx = snap.activeTestIdx;
      state.row = snap.row;
      state.col = snap.col;
      state.mode = 'nav';
      state.modal = null;
      clampCursor();
      persistConfig();
      persistSuite();
      setStatus('Redid change', 'ok');
      render(true);
    }

    /* =========================================================================
       TEST & STEP MUTATIONS
       ========================================================================= */

    function switchTest(idx) {
      if (idx < 0 || idx >= state.tests.length) return;
      state.activeTestIdx = idx;
      state.row = 0;
      state.mode = 'nav';
      clampCursor();
      setStatus(`Active test: ${activeTest().id}`);
      render(true);
    }

    function createNewTest() {
      pushUndo();
      let maxNum = 0;
      state.tests.forEach(t => {
        const m = /^TC-(\d+)$/i.exec(t.id || '');
        if (m) maxNum = Math.max(maxNum, Number(m[1]));
      });
      const nextNum = Math.max(state.tests.length + 1, maxNum + 1);
      const id = 'TC-' + String(nextNum).padStart(2, '0');
      state.tests.push({
        id,
        summary: 'New test case',
        description: '',
        priority: state.config.defaultPriority || '2',
        labels: [],
        components: [],
        requirement: '',
        repoPath: '',
        steps: [{ action: '', data: '', expected: '' }]
      });
      state.activeTestIdx = state.tests.length - 1;
      state.row = 0;
      state.col = 0;
      state.mode = 'summary';
      state.metaDraft = 'New test case';
      persistSuite();
      setStatus(`Created ${id} — enter Test Summary and press Enter`, 'ok');
      render(true);
    }

    function duplicateTest() {
      const t = activeTest();
      pushUndo();
      const copy = deepClone(t);
      const id = 'TC-' + String(state.tests.length + 1).padStart(2, '0');
      copy.id = id;
      copy.summary = t.summary + ' (Copy)';
      state.tests.splice(state.activeTestIdx + 1, 0, copy);
      state.activeTestIdx += 1;
      state.row = 0;
      persistSuite();
      setStatus(`Duplicated into ${id}`, 'ok');
      render(true);
    }

    function deleteCurrentTest() {
      if (state.tests.length <= 1) {
        setStatus('Suite must keep at least 1 test case', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const removed = activeTest().id;
      state.tests.splice(state.activeTestIdx, 1);
      clampCursor();
      persistSuite();
      setStatus(`Deleted ${removed}`, 'warn');
      render(true);
    }

    function setPriorityValue(val) {
      const t = activeTest();
      const found = (state.config.priorities || []).find(p => String(p.value) === String(val));
      if (!found) {
        setStatus(`Priority "${val}" not in Central Config`, 'warn');
        render(true);
        return;
      }
      if (t.priority === found.value) {
        setStatus(`${t.id} priority is already ${found.label}`);
        render(true);
        return;
      }
      pushUndo();
      t.priority = found.value;
      persistSuite();
      setStatus(`${t.id} priority set to ${found.label}`, 'ok');
      notifyTourEvent('priority');
      render(true);
    }

    function cyclePriority() {
      const t = activeTest();
      const list = state.config.priorities || [];
      if (list.length === 0) return;
      const idx = list.findIndex(p => p.value === t.priority);
      const next = list[(idx + 1) % list.length];
      setPriorityValue(next.value);
    }

    function startMetaEdit(field) {
      const t = activeTest();
      state.mode = field; // 'summary' | 'description' | 'requirement' | 'repoPath'
      state.metaDraft = t[field] || '';
      const label = field === 'summary'
        ? 'Test Summary'
        : (field === 'description' ? 'Jira Description' : (field === 'repoPath' ? 'Test Repository Path' : 'Requirement key'));
      setStatus(`Editing ${label}`);
      render(true);
    }

    function commitMetaEdit() {
      const t = activeTest();
      const field = state.mode;
      const inp = document.getElementById('meta-inline-input');
      const val = (inp ? inp.value : state.metaDraft).trim();
      if (field === 'summary') {
        const nextVal = val || 'Untitled test';
        if (nextVal !== t.summary) {
          pushUndo();
          t.summary = nextVal;
          persistSuite();
        }
        setStatus(`Saved ${t.id} summary`, 'ok');
      } else if (field === 'description') {
        if (val !== (t.description || '')) {
          pushUndo();
          t.description = val;
          persistSuite();
        }
        setStatus(`Saved ${t.id} description`, 'ok');
      } else if (field === 'requirement') {
        if (val !== (t.requirement || '')) {
          pushUndo();
          t.requirement = val;
          persistSuite();
        }
        setStatus(`Saved ${t.id} requirement`, 'ok');
      } else if (field === 'repoPath') {
        if (val !== (t.repoPath || '')) {
          pushUndo();
          t.repoPath = val;
          persistSuite();
        }
        setStatus(`Saved ${t.id} path`, 'ok');
      }
      state.mode = 'nav';
      render(true);
    }

    function startCellEdit() {
      const t = activeTest();
      const cols = getEffectiveStepColumns(state.config, state.uiMode, t, state.simpleShowData);
      const colObj = cols[state.col];
      state.editDraft = t.steps[state.row][colObj.key] || '';
      state.mode = 'edit';
      setStatus(`Editing Step ${state.row + 1} · ${colObj.label}`);
      render(true);
    }

    function commitCellEdit(nextAction) {
      const t = activeTest();
      const cols = getEffectiveStepColumns(state.config, state.uiMode, t, state.simpleShowData);
      const colObj = cols[state.col];
      const inp = document.getElementById('cell-textarea');
      const nextVal = inp ? inp.value : state.editDraft;
      const prevVal = t.steps[state.row][colObj.key] || '';

      if (nextVal !== prevVal) {
        pushUndo();
        t.steps[state.row][colObj.key] = nextVal;
      }

      if (nextAction === 'tabNext') {
        if (state.col + 1 < cols.length) {
          state.col += 1;
        } else if (state.row + 1 < t.steps.length) {
          state.row += 1;
          state.col = 0;
        } else {
          if (nextVal === prevVal) pushUndo();
          t.steps.push({ action: '', data: '', expected: '' });
          state.row = t.steps.length - 1;
          state.col = 0;
        }
        state.editDraft = t.steps[state.row][cols[state.col].key] || '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Editing Step ${state.row + 1} · ${cols[state.col].label}`);
        notifyTourEvent('edit-commit');
        render(true);
        return;
      }

      if (nextAction === 'tabPrev') {
        if (state.col > 0) {
          state.col -= 1;
        } else if (state.row > 0) {
          state.row -= 1;
          state.col = cols.length - 1;
        }
        state.editDraft = t.steps[state.row][cols[state.col].key] || '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Editing Step ${state.row + 1} · ${cols[state.col].label}`);
        notifyTourEvent('edit-commit');
        render(true);
        return;
      }

      if (nextAction === 'newStep') {
        const insertAt = state.row + 1;
        if (nextVal === prevVal) pushUndo();
        t.steps.splice(insertAt, 0, { action: '', data: '', expected: '' });
        state.row = insertAt;
        state.col = 0;
        state.editDraft = '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Inserted Step ${insertAt + 1} (editing)`, 'ok');
        notifyTourEvent('edit-commit');
        render(true);
        return;
      }

      if (nextAction === 'enter' && state.row + 1 < t.steps.length) {
        state.row += 1;
      }
      state.mode = 'nav';
      persistSuite();
      setStatus(`Saved ${colObj.label}`, 'ok');
      notifyTourEvent('edit-commit');
      render(true);
    }

    function insertStepBelow(enterEdit = true) {
      const t = activeTest();
      pushUndo();
      const insertAt = state.row + 1;
      t.steps.splice(insertAt, 0, { action: '', data: '', expected: '' });
      state.row = insertAt;
      state.col = 0;
      persistSuite();
      if (enterEdit) {
        state.editDraft = '';
        state.mode = 'edit';
        setStatus(`Added Step ${insertAt + 1} (editing)`, 'ok');
      } else {
        state.mode = 'nav';
        setStatus(`Added Step ${insertAt + 1}`, 'ok');
      }
      render(true);
    }

    function duplicateStep() {
      const t = activeTest();
      pushUndo();
      const copy = deepClone(t.steps[state.row]);
      const insertAt = state.row + 1;
      t.steps.splice(insertAt, 0, copy);
      state.row = insertAt;
      state.mode = 'nav';
      persistSuite();
      setStatus(`Duplicated into Step ${insertAt + 1}`, 'ok');
      render(true);
    }

    function deleteStep() {
      const t = activeTest();
      if (t.steps.length <= 1) {
        setStatus('Each test must have at least 1 step', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const num = state.row + 1;
      t.steps.splice(state.row, 1);
      clampCursor();
      persistSuite();
      setStatus(`Deleted Step ${num}`, 'warn');
      render(true);
    }

    function moveStep(delta) {
      const t = activeTest();
      const target = state.row + delta;
      if (target < 0 || target >= t.steps.length) {
        setStatus(delta < 0 ? 'Already on Step 1' : 'Already on last step', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const tmp = t.steps[state.row];
      t.steps[state.row] = t.steps[target];
      t.steps[target] = tmp;
      state.row = target;
      persistSuite();
      setStatus(`Moved step to position ${target + 1}`, 'ok');
      notifyTourEvent('reorder');
      render(true);
    }

    function moveColumn(delta) {
      const visibleCols = getVisibleStepColumns(state.config);
      const target = state.col + delta;
      if (target < 0 || target >= visibleCols.length) {
        setStatus(delta < 0 ? 'Column already leftmost' : 'Column already rightmost', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const movedLabel = visibleCols[state.col].label;
      const colA = visibleCols[state.col].key;
      const colB = visibleCols[target].key;
      const order = [...state.config.columnOrder];
      const idxA = order.indexOf(colA);
      const idxB = order.indexOf(colB);
      order[idxA] = colB;
      order[idxB] = colA;
      state.config.columnOrder = order;
      state.col = target;
      persistConfig();
      setStatus(`Moved column "${movedLabel}" ${delta < 0 ? 'left' : 'right'}`, 'ok');
      notifyTourEvent('reorder');
      render(true);
    }

    function toggleStepColumn(colKey) {
      const hidden = new Set(state.config.hiddenColumns || []);
      const visible = getVisibleStepColumns(state.config);
      if (!hidden.has(colKey) && visible.length <= 1) {
        setStatus('At least 1 step column must stay visible', 'warn');
        render(true);
        return;
      }
      pushUndo();
      if (hidden.has(colKey)) hidden.delete(colKey);
      else hidden.add(colKey);
      state.config.hiddenColumns = [...hidden];
      clampCursor();
      persistConfig();
      setStatus(`${hidden.has(colKey) ? 'Hidden' : 'Shown'} column "${state.config.headers[colKey] || colKey}"`, 'ok');
      render(true);
    }

    function syncConfigDraftFromDom() {
      if (!state.configDraft) return;
      const d = state.configDraft;
      const getVal = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : null;
      };
      const getChecked = (id) => {
        const el = document.getElementById(id);
        return el ? !!el.checked : false;
      };

      d.allowCustomLabels = getChecked('cfg-custom-labels');
      d.allowCustomComponents = getChecked('cfg-custom-comps');
      d.includeUtf8Bom = getChecked('cfg-utf8-bom');
      d.autoWriteCsvToFolder = getChecked('cfg-auto-csv');

      const csvDel = getVal('cfg-csv-delim');
      if (csvDel === ',' || csvDel === ';') d.csvDelimiter = csvDel;
      const listDel = getVal('cfg-list-delim');
      if (listDel !== null && listDel.trim()) d.listDelimiter = listDel.trim();
      const labelSpaceRep = getVal('cfg-label-space-rep');
      if (labelSpaceRep === '_' || labelSpaceRep === '-' || labelSpaceRep === 'none') d.labelSpaceReplacement = labelSpaceRep;
      const defPrio = getVal('cfg-default-prio');
      if (defPrio) d.defaultPriority = defPrio;
      const defUi = getVal('cfg-default-ui-mode');
      if (defUi === 'simple' || defUi === 'expert') d.defaultUiMode = defUi;

      (d.priorities || []).forEach((p, idx) => {
        const lbl = getVal(`cfg-prio-label-${idx}`);
        if (lbl !== null && lbl.trim()) p.label = lbl.trim();
      });

      Object.keys(d.headers).forEach(k => {
        const hv = getVal(`cfg-hdr-${k}`);
        if (hv !== null && hv.trim()) d.headers[k] = hv.trim();
      });
    }

    async function handleAiAttachFile(file) {
      if (!file) return;
      syncAiInputsFromDom();
      state.aiImport.error = '';
      state.aiImport.attachedFileName = file.name;
      const lower = file.name.toLowerCase();

      try {
        if (lower.endsWith('.xlsx')) {
          const buf = await file.arrayBuffer();
          const sheets = await parseXlsxSheets(buf);
          if (sheets.length === 0) throw new Error('No worksheets found inside .xlsx file.');
          state.aiImport.rawInput = formatSheetsForAiPrompt(sheets, file.name);
        } else {
          const buf = await file.arrayBuffer();
          const text = decodeTextBytes(buf);
          state.aiImport.rawInput = text.slice(0, 35000) + (text.length > 35000 ? '\n\n[Truncated at 35,000 characters]' : '');
        }
        setStatus(`Loaded "${file.name}" into AI input`, 'ok');
        render(false);
      } catch (err) {
        state.aiImport.error = 'Could not read attached file: ' + (err?.message || err);
        render(false);
      }
    }

    async function runAiSmartImport() {
      syncAiInputsFromDom();
      const ai = state.aiImport;
      const sourceText = String(ai.rawInput || '').trim();
      if (!sourceText) {
        ai.error = 'Paste some text or attach a file before generating.';
        render(true);
        return;
      }

      ai.error = '';
      ai.loading = true;
      ai.generatedTests = [];
      ai.droppedLabels = [];
      ai.droppedComponents = [];
      setStatus('Calling AI API to structure test cases…');
      render(false);

      try {
        const schema = buildAiImportSchema(state.config);
        const systemPrompt = buildAiSystemPrompt(state.config, activeProject(), ai.extraInstructions);
        const req = buildAiProviderRequest({
          provider: ai.provider,
          apiKey: ai.apiKey,
          model: ai.model,
          customEndpoint: ai.customEndpoint,
          systemPrompt,
          userPrompt: sourceText,
          schema
        });

        const res = await fetch(req.url, {
          method: 'POST',
          headers: req.headers,
          body: JSON.stringify(req.body)
        });

        const rawBody = await res.text();
        let json;
        try { json = JSON.parse(rawBody); } catch (_e) { json = null; }

        if (!res.ok) {
          const apiErrMsg = json?.error?.message || json?.message || rawBody.slice(0, 260) || `HTTP ${res.status}`;
          throw new Error(`API error (${res.status}): ${apiErrMsg}`);
        }

        const textOut = extractAiResponseText(ai.provider, json);
        if (!textOut) throw new Error('Model returned an empty response.');

        const parsedResult = parseAiImportedTests(textOut, state.config);
        ai.generatedTests = parsedResult.tests;
        ai.droppedLabels = parsedResult.droppedLabels;
        ai.droppedComponents = parsedResult.droppedComponents;
        ai.showSettings = false;
        ai.loading = false;
        setStatus(`AI generated ${parsedResult.tests.length} test case(s) — review and Append or Replace`, 'ok');
        render(false);
      } catch (err) {
        ai.loading = false;
        const msg = err?.message || String(err);
        ai.error = msg.includes('Failed to fetch')
          ? `${msg} (Check internet access, endpoint URL, or CORS policy on this endpoint.)`
          : msg;
        setStatus('AI generation failed', 'err');
        render(false);
      }
    }

    function executeAiImport(replaceSuite) {
      const generated = state.aiImport.generatedTests || [];
      if (generated.length === 0) return;
      const imported = deepClone(generated);
      pushUndo();
      if (replaceSuite) {
        state.tests = imported;
        state.activeTestIdx = 0;
      } else {
        const existingIds = new Set(state.tests.map(t => t.id));
        imported.forEach(t => {
          while (existingIds.has(t.id)) {
            t.id = 'TC-' + String(state.tests.length + 1).padStart(2, '0');
          }
          existingIds.add(t.id);
          state.tests.push(t);
        });
        state.activeTestIdx = state.tests.length - imported.length;
      }
      state.row = 0;
      state.col = 0;
      clampCursor();
      persistSuite();
      state.aiImport.generatedTests = [];
      closeModal(`Imported ${imported.length} AI-generated test case(s) into ${activeProject().name}`);
    }

    async function handleImportFile(file) {
      if (!file) return;
      state.importState.error = '';
      state.importState.sourceName = file.name;
      const lower = file.name.toLowerCase();

      try {
        if (lower.endsWith('.json')) {
          const text = await file.text();
          const parsedProj = parseProjectFile(text, file.name);
          const parsed = parsedProj ? parsedProj.tests : JSON.parse(text);
          if (Array.isArray(parsed)) {
            pushUndo();
            state.tests = parsed;
            state.activeTestIdx = 0;
            state.row = 0;
            state.col = 0;
            clampCursor();
            persistSuite();
            closeModal(`Loaded ${parsed.length} test(s) from ${file.name} into ${activeProject().name}`);
            return;
          }
          throw new Error('JSON file must be a project file or an array of test cases.');
        }

        if (lower.endsWith('.xlsx')) {
          const buf = await file.arrayBuffer();
          const sheets = await parseXlsxSheets(buf);
          if (sheets.length === 0) throw new Error('No worksheets found inside .xlsx file.');
          state.importState.sheets = sheets;
          state.importState.sheetIdx = 0;
          loadImportRows(sheets[0].rows);
          render(false);
          return;
        }

        const buf = await file.arrayBuffer();
        const text = decodeTextBytes(buf);
        const parsed = parseCsvText(text);
        state.importState.sheets = [{ name: 'CSV', rows: parsed.rows }];
        state.importState.sheetIdx = 0;
        loadImportRows(parsed.rows);
        render(false);
      } catch (err) {
        state.importState.error = err.message || 'Could not parse file.';
        render(false);
      }
    }

    function handlePastedImportText(text) {
      const clean = String(text || '').trim();
      if (!clean) return;
      state.importState.error = '';
      state.importState.sourceName = 'Pasted Excel / CSV cells';
      const parsed = parseCsvText(clean);
      state.importState.sheets = [{ name: 'Clipboard', rows: parsed.rows }];
      state.importState.sheetIdx = 0;
      loadImportRows(parsed.rows);
      render(false);
    }

    function loadImportRows(rows) {
      state.importState.rows = rows || [];
      if (rows.length > 0) {
        state.importState.mapping = autoMapHeaders(rows[0]);
      } else {
        state.importState.mapping = null;
        state.importState.error = 'No non-empty rows found.';
      }
    }

    function selectImportSheet(idx) {
      const sheet = state.importState.sheets[idx];
      if (!sheet) return;
      state.importState.sheetIdx = idx;
      loadImportRows(sheet.rows);
      render(false);
    }

    function updateImportMapping(field, colIdxStr) {
      if (!state.importState.mapping) return;
      state.importState.mapping[field] = Number(colIdxStr);
    }

    function executeImport(replaceSuite) {
      const imp = state.importState;
      if (!imp.rows || imp.rows.length === 0 || !imp.mapping) return;
      const imported = normalizeImportedRows(imp.rows, imp.mapping, imp.hasHeaderRow, state.config);
      pushUndo();
      if (replaceSuite) {
        state.tests = imported;
        state.activeTestIdx = 0;
      } else {
        const existingIds = new Set(state.tests.map(t => t.id));
        imported.forEach(t => {
          while (existingIds.has(t.id)) {
            t.id = 'TC-' + String(state.tests.length + 1).padStart(2, '0');
          }
          existingIds.add(t.id);
          state.tests.push(t);
        });
        state.activeTestIdx = state.tests.length - imported.length;
      }
      state.row = 0;
      state.col = 0;
      clampCursor();
      persistSuite();
      closeModal(`Imported ${imported.length} test case(s) from ${imp.sourceName}`);
    }

    /* --- Export & Quick-Fix Actions --- */

    function triggerDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadXrayCsv() {
      const csv = buildXrayCsv(state.tests, state.config);
      const payload = state.config.includeUtf8Bom ? ('\uFEFF' + csv) : csv;
      const csvName = activeProject().fileName.replace(/\.json$/i, '') + '.xray.csv';
      triggerDownload(csvName, payload, 'text/csv;charset=utf-8');
      setStatus(`Downloaded ${csvName}`, 'ok');
      render(false);
    }

    function downloadSuiteJson() {
      downloadActiveProjectJson();
    }

    function copyXrayCsv() {
      const csv = buildXrayCsv(state.tests, state.config);
      const done = () => {
        state.exportCopied = true;
        setStatus('Copied Xray Cloud CSV to clipboard', 'ok');
        render(false);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(csv).then(done).catch(() => fallbackCopy(csv, done));
      } else {
        fallbackCopy(csv, done);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        onDone();
      } finally {
        document.body.removeChild(ta);
      }
    }

    function fixUnknownTagsToConfig() {
      const issues = validateSuite(state.tests, state.config);
      const extraLabels = [];
      const extraComps = [];
      issues.forEach(iss => {
        if (iss.kind === 'labels') extraLabels.push(...iss.values);
        if (iss.kind === 'components') extraComps.push(...iss.values);
      });
      if (extraLabels.length === 0 && extraComps.length === 0) return;
      pushUndo();
      state.config.labels = dedupeStrings([...state.config.labels, ...extraLabels]);
      state.config.components = dedupeStrings([...state.config.components, ...extraComps]);
      persistConfig();
      setStatus('Added imported tags to Central Config', 'ok');
      render(false);
    }

    function stripUnknownTagsFromTests() {
      const allowedL = new Set(state.config.labels || []);
      const allowedC = new Set(state.config.components || []);
      pushUndo();
      state.tests.forEach(t => {
        if (!state.config.allowCustomLabels) t.labels = (t.labels || []).filter(l => allowedL.has(l));
        if (!state.config.allowCustomComponents) t.components = (t.components || []).filter(c => allowedC.has(c));
      });
      persistSuite();
      setStatus('Stripped unconfigured Labels/Components from tests', 'ok');
      render(false);
    }

    function fixSpacedLabels(rep = '_') {
      pushUndo();
      state.tests.forEach(t => {
        t.labels = dedupeStrings((t.labels || []).map(l => sanitizeLabel(l, rep)));
      });
      state.config.labels = dedupeStrings((state.config.labels || []).map(l => sanitizeLabel(l, rep)));
      persistConfig();
      persistSuite();
      setStatus(`Replaced spaces in Labels with "${rep}"`, 'ok');
      render(false);
    }

    /* =========================================================================
       RENDERING
       ========================================================================= */

    function getPriorityLabel(val) {
      const found = (state.config.priorities || []).find(p => String(p.value) === String(val));
      return found ? found.label : String(val || '?');
    }

    function prioClass(val) {
      if (val === '1') return 'prio-1';
      if (val === '2') return 'prio-2';
      if (val === '3') return 'prio-3';
      return 'prio-other';
    }

    function renderSidebar() {
      const isSimple = state.uiMode === 'simple';

      if (isSimple) {
        const cards = state.tests.map((t, idx) => {
          const active = idx === state.activeTestIdx;
          const stepCount = (t.steps || []).length;
          return `
            <button
              type="button"
              tabindex="-1"
              onclick="switchTest(${idx})"
              class="test-card ${active ? 'active' : ''}"
            >
              <div class="truncate" style="font-weight:600;font-size:13px">${escHtml(t.summary || 'Untitled test case')}</div>
              <div class="muted mono" style="font-size:11px">${escHtml(t.id)} · ${stepCount} ${stepCount === 1 ? 'step' : 'steps'}</div>
            </button>
          `;
        }).join('');

        return `
          <aside class="sidebar" aria-label="Test Cases">
            <div class="sidebar-head">
              <span style="font-weight:700">Test Cases (${state.tests.length})</span>

            </div>
            <div class="test-list">${cards}</div>
          </aside>
        `;
      }

      const allowedL = new Set(state.config.labels || []);
      const allowedC = new Set(state.config.components || []);
      const issuesByTest = new Map();
      validateSuite(state.tests, state.config).forEach(iss => {
        const prev = issuesByTest.get(iss.testIdx);
        if (!prev || iss.severity === 'error') issuesByTest.set(iss.testIdx, iss.severity);
      });

      const cards = state.tests.map((t, idx) => {
        const active = idx === state.activeTestIdx;
        const sev = issuesByTest.get(idx);
        const chips = [
          ...(t.labels || []).slice(0, 3).map(l =>
            `<span class="chip label ${!state.config.allowCustomLabels && !allowedL.has(l) ? 'invalid' : ''}">${escHtml(l)}</span>`
          ),
          ...(t.components || []).slice(0, 2).map(c =>
            `<span class="chip comp ${!state.config.allowCustomComponents && !allowedC.has(c) ? 'invalid' : ''}">${escHtml(c)}</span>`
          )
        ].join('');

        return `
          <button
            type="button"
            tabindex="-1"
            onclick="switchTest(${idx})"
            class="test-card ${active ? 'active' : ''}"
          >
            <div class="test-card-top">
              <span class="mono" style="font-weight:700">${escHtml(t.id)}</span>
              <div style="display:flex;align-items:center;gap:5px">
                ${sev ? `<span style="color:var(${sev === 'error' ? '--error' : '--warning'});font-weight:700">${sev === 'error' ? '●' : '▲'}</span>` : ''}
                <span class="prio-badge ${prioClass(t.priority)}">P${escHtml(t.priority || '?')}</span>
              </div>
            </div>
            <div class="truncate" style="font-weight:600">${escHtml(t.summary || '(No summary)')}</div>

      return `
        <aside class="sidebar" aria-label="Test Cases">
          <div class="sidebar-head">
            <span style="font-weight:700">Tests (${state.tests.length})</span>
            <div style="display:flex;gap:4px">
              <button type="button" tabindex="-1" onclick="createNewTest()" title="New Test Case (t)">+ Test <kbd>t</kbd></button>
            </div>
          </div>
          <div class="test-list">${cards}</div>
        </aside>
      `;
    }

    function renderMetaPanel() {
      const t = activeTest();

      if (state.uiMode === 'simple') {
        const stepCount = (t.steps || []).length;
        const titleNode = state.mode === 'summary'
          ? `<input id="meta-inline-input" class="simple-title-input" type="text" value="${escHtml(state.metaDraft)}" aria-label="Test Case Title" placeholder="What does this test verify?" />`

          : `<div class="simple-desc ${t.description ? '' : 'empty'}" onclick="startMetaEdit('description')" title="Click or press Shift+D to edit description">${t.description ? escHtml(t.description) : '+ Add description…'}</div>`;

        return `
          <section class="meta-panel" aria-label="Test Case Title">
            <div class="simple-doc">

      const allowedL = new Set(state.config.labels || []);

      const summaryNode = state.mode === 'summary'
        ? `<input id="meta-inline-input" type="text" value="${escHtml(state.metaDraft)}" aria-label="Test Summary" style="min-width:280px;flex:1" />`
        : `<span class="summary-title truncate" onclick="startMetaEdit('summary')" title="Click or press s to edit Summary">${escHtml(t.summary || '(Missing summary)')}</span>`;

      const descNode = state.mode === 'description'
        ? `<textarea id="meta-inline-input" rows="2" aria-label="Jira Description" placeholder="Jira test case description / preconditions (Enter to save, Shift+Enter for new line)..." style="width:100%;resize:vertical">${escHtml(state.metaDraft)}</textarea>`
        : `<div class="desc-bar" onclick="startMetaEdit('description')" title="Click or press Shift+D to edit Jira Description">
             <span class="muted">Description:</span>
             <span class="desc-text ${t.description ? '' : 'faint'}">${escHtml(t.description || 'None (click or Shift+D to add)')}</span>
             <kbd>Shift+D</kbd>
           </div>`;

      const reqNode = state.mode === 'requirement'
        ? `<input id="meta-inline-input" type="text" value="${escHtml(state.metaDraft)}" placeholder="KEY-123" aria-label="Requirement Key" class="mono" style="width:120px" />`
        : `<span class="field-pill" onclick="startMetaEdit('requirement')" title="Click or press r to edit Requirement">
             <span class="muted">Req:</span>
             <span class="mono">${escHtml(t.requirement || 'None')}</span>
             <kbd>r</kbd>
           </span>`;

      const pathNode = state.mode === 'repoPath'
        ? `<input id="meta-inline-input" type="text" value="${escHtml(state.metaDraft)}" placeholder="e.g. Checkout / Promo Codes" aria-label="Test Repository Path" style="min-width:190px" />`
        : `<span class="field-pill" onclick="startMetaEdit('repoPath')" title="Click or press f to edit Test Repository Path / Folder">
             <span class="muted">Path:</span>
             <span class="${t.repoPath ? '' : 'faint'}">${escHtml(t.repoPath || 'None')}</span>
             <kbd>f</kbd>
           </span>`;

      const labelChips = (t.labels || []).length > 0
        ? t.labels.map(l => {
            const hasSpace = /\s/.test(l);
            const invalid = hasSpace || (!state.config.allowCustomLabels && !allowedL.has(l));
            return `<span class="chip label ${invalid ? 'invalid' : ''}"${hasSpace ? ' title="Jira labels cannot contain spaces"' : ''}>${escHtml(l)}</span>`;

        : '<span class="faint">None</span>';

        ? t.components.map(c => `<span class="chip comp ${!state.config.allowCustomComponents && !allowedC.has(c) ? 'invalid' : ''}">${escHtml(c)}</span>`).join('')
        : '<span class="faint">None</span>';

            tabindex="-1"
            onclick="setPriorityValue('${escHtml(p.value)}')"
            class="${active ? 'prio-badge ' + prioClass(p.value) : ''}"
            style="padding:2px 8px;${active ? 'font-weight:700;' : 'opacity:0.7;'}"
            title="Press ${escHtml(p.value)} to set ${escHtml(p.label)}"
          >${escHtml(p.value)}</button>

      return `
        <section class="meta-panel" data-tour-target="meta-fields" aria-label="Test Case Metadata">

              <div class="chip-row">${labelChips}</div>
              <kbd>l</kbd>
            </div>
            <div class="field-pill" onclick="openPicker('components')" title="Pick Components (c)">
              <span class="muted">Components:</span>
              <div class="chip-row">${compChips}</div>
              <kbd>c</kbd>

    function renderGrid() {
      const t = activeTest();
      const isSimple = state.uiMode === 'simple';
      const cols = getEffectiveStepColumns(state.config, state.uiMode, t, state.simpleShowData);
      const colTemplate = `${isSimple ? '44px' : '46px'} repeat(${cols.length}, minmax(0, 1fr))`;
      const hasAnyData = !!(t && Array.isArray(t.steps) && t.steps.some(s => String((s && s.data) || '').trim() !== ''));

      const headerRow = `
        <div role="row" aria-rowindex="1" data-tour-target="grid-header" class="grid-row header" style="grid-template-columns:${colTemplate}">
          <div role="columnheader" aria-colindex="1" class="grid-row-num">#</div>
          ${cols.map((c, cIdx) => {
            const active = cIdx === state.col;
            return `
              <div role="columnheader" aria-colindex="${cIdx + 2}" class="grid-col-header ${!isSimple && active ? 'active-col' : ''}">
                <span class="truncate">${escHtml(c.label)}</span>
                ${!isSimple && active ? `<span class="mono" style="color:var(--primary);font-size:11px;opacity:0.85" title="Press Alt+← or Alt+→ to reorder column (sets CSV order)">⇄</span>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;

      const bodyRows = t.steps.map((step, rIdx) => {
        const isCurrentRow = rIdx === state.row;
        const cells = cols.map((c, cIdx) => {
          const isSelected = isCurrentRow && cIdx === state.col;
          const isEditing = isSelected && state.mode === 'edit';
          const val = step[c.key] || '';

          if (isEditing) {
            return `
              <div role="gridcell" aria-rowindex="${rIdx + 2}" aria-colindex="${cIdx + 2}" aria-selected="true" class="grid-cell editing">
                <textarea
                  id="cell-textarea"
                  rows="2"
                  aria-label="Step ${rIdx + 1} ${escHtml(c.label)}"
                >${escHtml(state.editDraft)}</textarea>
              </div>
            `;
          }

          const emptyLabel = isSimple ? (isSelected ? 'Press Enter to write…' : '') : '(empty)';
          return `
            <div
              id="cell-${rIdx}-${cIdx}"
              role="gridcell"
              tabindex="${isSelected ? '0' : '-1'}"
              aria-rowindex="${rIdx + 2}"
              aria-colindex="${cIdx + 2}"
              aria-selected="${isSelected ? 'true' : 'false'}"
              onclick="onCellClick(${rIdx}, ${cIdx})"
              class="grid-cell ${isSelected ? 'selected' : ''} ${!val ? 'empty' : ''}"
            >${val ? escHtml(val) : emptyLabel}</div>
          `;
        }).join('');

        return `
          <div role="row" aria-rowindex="${rIdx + 2}" class="grid-row ${isCurrentRow ? 'active-row' : ''}" style="grid-template-columns:${colTemplate}">
            <div role="rowheader" aria-colindex="1" class="grid-row-num">${rIdx + 1}</div>
            ${cells}
          </div>
        `;
      }).join('');

      const tableHtml = `
        <div role="grid" data-tour-target="grid" aria-label="Test Steps for ${escHtml(t.id)}" class="grid-table">
          ${headerRow}
          ${bodyRows}
        </div>
      `;

      if (isSimple) {
        return `
          <div class="grid-wrap">
            <div class="simple-doc">
              ${tableHtml}
              <div class="simple-actions">
                <div style="display:flex;align-items:center;gap:4px">
                  <button type="button" tabindex="-1" class="link-btn" onclick="insertStepBelow(true)" title="Add step below (n)">+ Add step</button>
                  <button type="button" tabindex="-1" class="link-btn" onclick="createNewTest()" title="New test case (t)">+ New test case</button>
                </div>
                ${hasAnyData ? '' : `<button type="button" tabindex="-1" class="link-btn" onclick="toggleSimpleDataColumn()">${state.simpleShowData ? 'Hide Test Data column' : '+ Show Test Data column'}</button>`}
              </div>
            </div>
          </div>
        `;
      }

      return `<div class="grid-wrap">${tableHtml}</div>`;
    }

            <div class="modal-foot">
              <div class="hints">
                <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
                <span><kbd>Space</kbd> Toggle</span>
                <span><kbd>Enter</kbd> Apply</span>
                <span><kbd>Esc</kbd> Cancel</span>
              </div>
              <div style="display:flex;gap:6px">
                <button type="button" onclick="closeModal('Cancelled ${kind}')">Cancel</button>
                <button type="button" class="primary" onclick="applyPickerSelection()">Apply</button>

            </div>

        </div>
      `;

      if (options.length === 0) state.picker.idx = 0;
      else state.picker.idx = Math.max(0, Math.min(state.picker.idx, options.length - 1));
      const kind = state.picker.kind;
      const allowCustom = kind === 'labels' ? state.config.allowCustomLabels : state.config.allowCustomComponents;
      listEl.innerHTML = options.length === 0
        ? `<div class="muted" style="padding:12px;text-align:center">No matching ${kind}${allowCustom ? ' — press Ctrl+Enter to add custom' : ' (manage in Central Config [g])'}</div>`
        : options.map((opt, idx) => {
            const checked = state.picker.selected.includes(opt);
            const hl = idx === state.picker.idx;
            return `
              <button
                id="picker-opt-${idx}"
                type="button"
                tabindex="-1"
                onclick="state.picker.idx=${idx};togglePickerOption('${escHtml(opt).replace(/'/g, "\\'")}')"
                class="list-item ${hl ? 'highlighted' : ''}"
              >
                <span style="display:flex;align-items:center;gap:8px">
                  <span class="mono" style="font-weight:700;color:var(${checked ? '--success' : '--text-faint'})">${checked ? '[✓]' : '[ ]'}</span>

    function renderPaletteModal() {
      const cmds = getFilteredCommands();
      state.paletteIdx = cmds.length === 0 ? 0 : Math.max(0, Math.min(state.paletteIdx, cmds.length - 1));

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Command Palette">
          <div class="modal-card narrow">
            <div class="modal-head">
              <span class="modal-title">Command Palette</span>

                type="search"
                value="${escHtml(state.paletteQuery)}"

            </div>
          </div>
        </div>

    function renderPaletteListOnly() {
      const el = document.getElementById('palette-list');
      if (!el) return;
      const cmds = getFilteredCommands();
      state.paletteIdx = cmds.length === 0 ? 0 : Math.max(0, Math.min(state.paletteIdx, cmds.length - 1));
      el.innerHTML = cmds.length === 0
        ? `<div class="muted" style="padding:12px;text-align:center">No matching commands</div>`
        : cmds.map((c, idx) => `
            <button
              id="pal-item-${idx}"
              type="button"
              tabindex="-1"
              onclick="getFilteredCommands()[${idx}].run()"
              class="list-item ${idx === state.paletteIdx ? 'highlighted' : ''}"
            >
              <span>${escHtml(c.label)}</span>
              <kbd>${escHtml(c.key)}</kbd>
            </button>
          `).join('');
