    async function duplicateProjectAt(idx) {
      const src = state.projects[idx];
      if (!src) return;
      const newName = src.name + ' Copy';
      const { id, fileName } = slugifyProjectName(newName, state.projects.map(p => p.fileName));
      const copy = {
        id,
        fileName,
        name: newName,
        jiraProjectKey: src.jiraProjectKey || '',
        updatedAt: new Date().toISOString(),
        tests: deepClone(src.tests || [])
      };
      state.projects.splice(idx + 1, 0, copy);
      state.projectsModal.idx = idx + 1;
      persistWorkspaceLocalOnly();
      if (state.dirHandle) {
        await saveProjectToDirectory(state.dirHandle, copy, state.config, folderWriteQueue);
        state.syncStatus = 'saved';
        state.lastSyncTime = formatClockTime();
      }
      setStatus(`Duplicated into "${copy.name}" (${copy.fileName})`, 'ok');
      render(true);
    }

    async function deleteProjectAt(idx) {
      if (state.projects.length <= 1) {
        setStatus('Workspace must keep at least 1 project', 'warn');
        render(true);
        return;
      }
      const removed = state.projects[idx];
      state.projects.splice(idx, 1);
      if (state.activeProjectIdx >= state.projects.length) {
        state.activeProjectIdx = state.projects.length - 1;
      } else if (idx < state.activeProjectIdx) {
        state.activeProjectIdx -= 1;
      }
      state.projectsModal.idx = Math.min(idx, state.projects.length - 1);
      state.activeTestIdx = 0;
      state.row = 0;
      state.col = 0;
      persistWorkspaceLocalOnly();
      if (state.dirHandle && removed) {
        try {
          await deleteProjectFromDirectory(state.dirHandle, removed, folderWriteQueue);
          state.syncStatus = 'saved';
          state.lastSyncTime = formatClockTime();
        } catch (err) {
          setStatus('Removed from workspace; file delete error: ' + err.message, 'warn');
          render(true);
          return;
        }
      }
      setStatus(`Deleted project "${removed.name}"`, 'warn');
      render(true);
    }

    function downloadActiveProjectJson() {
      const proj = activeProject();
      triggerDownload(proj.fileName, serializeProjectFile(proj), 'application/json');
      setStatus(`Downloaded ${proj.fileName}`, 'ok');
      render(false);
    }

    async function importProjectJsonFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const parsedProj = parseProjectFile(text, file.name);
        let newProj;
        if (parsedProj) {
          const { id, fileName } = slugifyProjectName(parsedProj.name, state.projects.map(p => p.fileName));
          newProj = Object.assign({}, parsedProj, {
            id: state.projects.some(p => p.fileName === parsedProj.fileName) ? id : parsedProj.id,
            fileName: state.projects.some(p => p.fileName === parsedProj.fileName) ? fileName : parsedProj.fileName,
            updatedAt: new Date().toISOString()
          });
        } else {
          const raw = JSON.parse(text);
          if (!Array.isArray(raw)) throw new Error('Expected a project JSON or test array.');
          const baseName = file.name.replace(/\.json$/i, '');
          const { id, fileName } = slugifyProjectName(baseName, state.projects.map(p => p.fileName));
          newProj = {
            id,
            fileName,
            name: baseName,
            jiraProjectKey: '',
            updatedAt: new Date().toISOString(),
            tests: raw
          };
        }
        state.projects.push(newProj);
        state.activeProjectIdx = state.projects.length - 1;
        state.projectsModal.idx = state.activeProjectIdx;
        state.activeTestIdx = 0;
        state.row = 0;
        state.col = 0;
        persistWorkspaceLocalOnly();
        if (state.dirHandle) {
          await saveProjectToDirectory(state.dirHandle, newProj, state.config, folderWriteQueue);
        }
        setStatus(`Added project "${newProj.name}"`, 'ok');
        render(true);
      } catch (err) {
        setStatus('Project import failed: ' + err.message, 'err');
        render(false);
      }
    }

    function activeTest() {
      return state.tests[state.activeTestIdx] || state.tests[0];
    }

    function clampCursor() {
      if (state.projects.length === 0) {
        state.projects = loadInitialProjects(state.config).projects;
      }
      state.activeProjectIdx = Math.max(0, Math.min(state.activeProjectIdx, state.projects.length - 1));
      if (state.tests.length === 0) {
        state.tests = makeDefaultTests(state.config);
      }
      state.activeTestIdx = Math.max(0, Math.min(state.activeTestIdx, state.tests.length - 1));
      const t = activeTest();
      if (!t.steps || t.steps.length === 0) t.steps = [{ action: '', data: '', expected: '' }];
      const cols = getVisibleStepColumns(state.config);
      state.row = Math.max(0, Math.min(state.row, t.steps.length - 1));
      state.col = Math.max(0, Math.min(state.col, cols.length - 1));
    }

    function setStatus(msg, tone = '') {
      state.statusMsg = msg;
      state.statusTone = tone;
    }

    function pushUndo() {
      state.undoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      if (state.undoStack.length > 25) state.undoStack.shift();
      state.redoStack = [];
    }

    function undo() {
      if (state.undoStack.length === 0) {
        setStatus('Nothing to undo', 'warn');
        render(true);
        return;
      }
      const snap = state.undoStack.pop();
      const targetProjIdx = state.projects.findIndex(p => p.id === snap.projectId);
      if (targetProjIdx >= 0) state.activeProjectIdx = targetProjIdx;
      state.redoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      state.tests = snap.tests;
      state.config = snap.config;
      state.activeTestIdx = snap.activeTestIdx;
      state.row = snap.row;
      state.col = snap.col;
      state.mode = 'nav';
      state.modal = null;
      clampCursor();
      persistConfig();
      persistSuite();
      setStatus('Undid last change', 'ok');
      render(true);
    }

    function redo() {
      if (state.redoStack.length === 0) {
        setStatus('Nothing to redo', 'warn');
        render(true);
        return;
      }
      const snap = state.redoStack.pop();
      const targetProjIdx = state.projects.findIndex(p => p.id === snap.projectId);
      if (targetProjIdx >= 0) state.activeProjectIdx = targetProjIdx;
      state.undoStack.push({
        projectId: activeProject().id,
        tests: deepClone(state.tests),
        config: deepClone(state.config),
        activeTestIdx: state.activeTestIdx,
        row: state.row,
        col: state.col
      });
      state.tests = snap.tests;
      state.config = snap.config;
      state.activeTestIdx = snap.activeTestIdx;
      state.row = snap.row;
      state.col = snap.col;
      state.mode = 'nav';
      state.modal = null;
      clampCursor();
      persistConfig();
      persistSuite();
      setStatus('Redid change', 'ok');
      render(true);
    }

    /* =========================================================================
       TEST & STEP MUTATIONS
       ========================================================================= */

    function switchTest(idx) {
      if (idx < 0 || idx >= state.tests.length) return;
      state.activeTestIdx = idx;
      state.row = 0;
      state.mode = 'nav';
      clampCursor();
      setStatus(`Active test: ${activeTest().id}`);
      render(true);
    }

    function createNewTest() {
      pushUndo();
      let maxNum = 0;
      state.tests.forEach(t => {
        const m = /^TC-(\d+)$/i.exec(t.id || '');
        if (m) maxNum = Math.max(maxNum, Number(m[1]));
      });
      const nextNum = Math.max(state.tests.length + 1, maxNum + 1);
      const id = 'TC-' + String(nextNum).padStart(2, '0');
      state.tests.push({
        id,
        summary: 'New test case',
        priority: state.config.defaultPriority || '2',
        labels: [],
        components: [],
        requirement: '',
        steps: [{ action: '', data: '', expected: '' }]
      });
      state.activeTestIdx = state.tests.length - 1;
      state.row = 0;
      state.col = 0;
      state.mode = 'summary';
      state.metaDraft = 'New test case';
      persistSuite();
      setStatus(`Created ${id} — enter Test Summary and press Enter`, 'ok');
      render(true);
    }

    function duplicateTest() {
      const t = activeTest();
      pushUndo();
      const copy = deepClone(t);
      const id = 'TC-' + String(state.tests.length + 1).padStart(2, '0');
      copy.id = id;
      copy.summary = t.summary + ' (Copy)';
      state.tests.splice(state.activeTestIdx + 1, 0, copy);
      state.activeTestIdx += 1;
      state.row = 0;
      persistSuite();
      setStatus(`Duplicated into ${id}`, 'ok');
      render(true);
    }

    function deleteCurrentTest() {
      if (state.tests.length <= 1) {
        setStatus('Suite must keep at least 1 test case', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const removed = activeTest().id;
      state.tests.splice(state.activeTestIdx, 1);
      clampCursor();
      persistSuite();
      setStatus(`Deleted ${removed}`, 'warn');
      render(true);
    }

    function setPriorityValue(val) {
      const t = activeTest();
      const found = (state.config.priorities || []).find(p => String(p.value) === String(val));
      if (!found) {
        setStatus(`Priority "${val}" not in Central Config`, 'warn');
        render(true);
        return;
      }
      if (t.priority === found.value) {
        setStatus(`${t.id} priority is already ${found.label}`);
        render(true);
        return;
      }
      pushUndo();
      t.priority = found.value;
      persistSuite();
      setStatus(`${t.id} priority set to ${found.label}`, 'ok');
      render(true);
    }

    function cyclePriority() {
      const t = activeTest();
      const list = state.config.priorities || [];
      if (list.length === 0) return;
      const idx = list.findIndex(p => p.value === t.priority);
      const next = list[(idx + 1) % list.length];
      setPriorityValue(next.value);
    }

    function startMetaEdit(field) {
      const t = activeTest();
      state.mode = field; // 'summary' | 'requirement'
      state.metaDraft = t[field] || '';
      setStatus(`Editing ${field === 'summary' ? 'Test Summary' : 'Requirement key'}`);
      render(true);
    }

    function commitMetaEdit() {
      const t = activeTest();
      const field = state.mode;
      const inp = document.getElementById('meta-inline-input');
      const val = (inp ? inp.value : state.metaDraft).trim();
      if (field === 'summary') {
        const nextVal = val || 'Untitled test';
        if (nextVal !== t.summary) {
          pushUndo();
          t.summary = nextVal;
          persistSuite();
        }
        setStatus(`Saved ${t.id} summary`, 'ok');
      } else if (field === 'requirement') {
        if (val !== (t.requirement || '')) {
          pushUndo();
          t.requirement = val;
          persistSuite();
        }
        setStatus(`Saved ${t.id} requirement`, 'ok');
      }
      state.mode = 'nav';
      render(true);
    }

    function startCellEdit() {
      const t = activeTest();
      const cols = getVisibleStepColumns(state.config);
      const colObj = cols[state.col];
      state.editDraft = t.steps[state.row][colObj.key] || '';
      state.mode = 'edit';
      setStatus(`Editing Step ${state.row + 1} · ${colObj.label}`);
      render(true);
    }

    function commitCellEdit(nextAction) {
      const t = activeTest();
      const cols = getVisibleStepColumns(state.config);
      const colObj = cols[state.col];
      const inp = document.getElementById('cell-textarea');
      const nextVal = inp ? inp.value : state.editDraft;
      const prevVal = t.steps[state.row][colObj.key] || '';

      if (nextVal !== prevVal) {
        pushUndo();
        t.steps[state.row][colObj.key] = nextVal;
      }

      if (nextAction === 'tabNext') {
        if (state.col + 1 < cols.length) {
          state.col += 1;
        } else if (state.row + 1 < t.steps.length) {
          state.row += 1;
          state.col = 0;
        } else {
          if (nextVal === prevVal) pushUndo();
          t.steps.push({ action: '', data: '', expected: '' });
          state.row = t.steps.length - 1;
          state.col = 0;
        }
        state.editDraft = t.steps[state.row][cols[state.col].key] || '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Editing Step ${state.row + 1} · ${cols[state.col].label}`);
        render(true);
        return;
      }

      if (nextAction === 'tabPrev') {
        if (state.col > 0) {
          state.col -= 1;
        } else if (state.row > 0) {
          state.row -= 1;
          state.col = cols.length - 1;
        }
        state.editDraft = t.steps[state.row][cols[state.col].key] || '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Editing Step ${state.row + 1} · ${cols[state.col].label}`);
        render(true);
        return;
      }

      if (nextAction === 'newStep') {
        const insertAt = state.row + 1;
        if (nextVal === prevVal) pushUndo();
        t.steps.splice(insertAt, 0, { action: '', data: '', expected: '' });
        state.row = insertAt;
        state.col = 0;
        state.editDraft = '';
        state.mode = 'edit';
        persistSuite();
        setStatus(`Inserted Step ${insertAt + 1} (editing)`, 'ok');
        render(true);
        return;
      }

      if (nextAction === 'enter' && state.row + 1 < t.steps.length) {
        state.row += 1;
      }
      state.mode = 'nav';
      persistSuite();
      setStatus(`Saved ${colObj.label}`, 'ok');
      render(true);
    }

    function insertStepBelow(enterEdit = true) {
      const t = activeTest();
      pushUndo();
      const insertAt = state.row + 1;
      t.steps.splice(insertAt, 0, { action: '', data: '', expected: '' });
      state.row = insertAt;
      state.col = 0;
      persistSuite();
      if (enterEdit) {
        state.editDraft = '';
        state.mode = 'edit';
        setStatus(`Added Step ${insertAt + 1} (editing)`, 'ok');
      } else {
        state.mode = 'nav';
        setStatus(`Added Step ${insertAt + 1}`, 'ok');
      }
      render(true);
    }

    function duplicateStep() {
      const t = activeTest();
      pushUndo();
      const copy = deepClone(t.steps[state.row]);
      const insertAt = state.row + 1;
      t.steps.splice(insertAt, 0, copy);
      state.row = insertAt;
      state.mode = 'nav';
      persistSuite();
      setStatus(`Duplicated into Step ${insertAt + 1}`, 'ok');
      render(true);
    }

    function deleteStep() {
      const t = activeTest();
      if (t.steps.length <= 1) {
        setStatus('Each test must have at least 1 step', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const num = state.row + 1;
      t.steps.splice(state.row, 1);
      clampCursor();
      persistSuite();
      setStatus(`Deleted Step ${num}`, 'warn');
      render(true);
    }

    function moveStep(delta) {
      const t = activeTest();
      const target = state.row + delta;
      if (target < 0 || target >= t.steps.length) {
        setStatus(delta < 0 ? 'Already on Step 1' : 'Already on last step', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const tmp = t.steps[state.row];
      t.steps[state.row] = t.steps[target];
      t.steps[target] = tmp;
      state.row = target;
      persistSuite();
      setStatus(`Moved step to position ${target + 1}`, 'ok');
      render(true);
    }

    function moveColumn(delta) {
      const visibleCols = getVisibleStepColumns(state.config);
      const target = state.col + delta;
      if (target < 0 || target >= visibleCols.length) {
        setStatus(delta < 0 ? 'Column already leftmost' : 'Column already rightmost', 'warn');
        render(true);
        return;
      }
      pushUndo();
      const movedLabel = visibleCols[state.col].label;
      const colA = visibleCols[state.col].key;
      const colB = visibleCols[target].key;
      const order = [...state.config.columnOrder];
      const idxA = order.indexOf(colA);
      const idxB = order.indexOf(colB);
      order[idxA] = colB;
      order[idxB] = colA;
      state.config.columnOrder = order;
      state.col = target;
      persistConfig();
      setStatus(`Moved column "${movedLabel}" ${delta < 0 ? 'left' : 'right'}`, 'ok');
      render(true);
    }

    function toggleStepColumn(colKey) {
      const hidden = new Set(state.config.hiddenColumns || []);
      const visible = getVisibleStepColumns(state.config);
      if (!hidden.has(colKey) && visible.length <= 1) {
        setStatus('At least 1 step column must stay visible', 'warn');
        render(true);
        return;
      }
      pushUndo();
      if (hidden.has(colKey)) hidden.delete(colKey);
      else hidden.add(colKey);
      state.config.hiddenColumns = [...hidden];
      clampCursor();
      persistConfig();
      setStatus(`${hidden.has(colKey) ? 'Hidden' : 'Shown'} column "${state.config.headers[colKey] || colKey}"`, 'ok');
      render(true);
    }

    /* =========================================================================
       MODALS: PICKER (LABELS / COMPONENTS), PALETTE, CENTRAL CONFIG, IMPORT, EXPORT
       ========================================================================= */

    function openModal(modalName) {
      state.mode = 'modal';
      state.modal = modalName;
      state.exportCopied = false;
      render(true);
    }

    function closeModal(statusText) {
      state.mode = 'nav';
      state.modal = null;
      if (statusText) setStatus(statusText);
      render(true);
    }

    function openPicker(kind) {
      const t = activeTest();
      state.picker = {
        kind, // 'labels' | 'components'
        selected: [...(t[kind] || [])],
        filter: '',
        idx: 0
      };
      setStatus(`Select ${kind} (Space toggle, Enter apply, Esc cancel)`);
      openModal(kind);
    }

    function getPickerOptions() {
      const kind = state.picker.kind;
      const central = kind === 'labels' ? state.config.labels : state.config.components;
      const combined = dedupeStrings([...central, ...state.picker.selected]);
      const q = state.picker.filter.trim().toLowerCase();
      if (!q) return combined;
      return combined.filter(opt => opt.toLowerCase().includes(q));
    }

    function togglePickerOption(val) {
      const idx = state.picker.selected.indexOf(val);
      if (idx >= 0) state.picker.selected.splice(idx, 1);
      else state.picker.selected.push(val);
      renderPickerListOnly();
    }

    function addCustomPickerValue() {
      const allow = state.picker.kind === 'labels'
        ? state.config.allowCustomLabels
        : state.config.allowCustomComponents;
      const val = state.picker.filter.trim();
      if (!allow || !val) return;
      if (!state.picker.selected.includes(val)) {
        state.picker.selected.push(val);
      }
      state.picker.filter = '';
      state.picker.idx = 0;
      render(true);
    }

    function applyPickerSelection() {
      const t = activeTest();
      const kind = state.picker.kind;
      pushUndo();
      t[kind] = dedupeStrings(state.picker.selected);
      persistSuite();
      closeModal(`Updated ${t.id} ${kind} (${t[kind].length} selected)`);
    }

    function openPalette() {
      state.paletteQuery = '';
      state.paletteIdx = 0;
      setStatus('Command palette open');
      openModal('palette');
    }

    function getCommands() {
      const hidden = new Set(state.config.hiddenColumns || []);
      return [
        { label: 'Projects & Local Folder Manager', key: 'w', run: () => openProjectsModal() },
        { label: state.dirHandle ? 'Reconnect / Change Local Folder' : 'Connect Local Folder (https / localhost)', key: 'o', run: () => { closeModal(); connectLocalFolder(true); } },
        ...(state.dirHandle ? [{ label: 'Rescan Connected Local Folder', key: 'f', run: () => { closeModal(); rescanConnectedFolder(); } }] : []),
        { label: state.dirHandle ? 'Save Now to Local Folder' : 'Download Active Project (.json)', key: 'Ctrl+S', run: () => { closeModal(); if (state.dirHandle) flushFolderSave(); else downloadActiveProjectJson(); } },
        { label: 'Pick Labels for active test', key: 'l', run: () => openPicker('labels') },
        { label: 'Pick Components for active test', key: 'c', run: () => openPicker('components') },
        { label: 'Set Priority 1 (High)', key: '1', run: () => { closeModal(); setPriorityValue('1'); } },
        { label: 'Set Priority 2 (Medium)', key: '2', run: () => { closeModal(); setPriorityValue('2'); } },
        { label: 'Set Priority 3 (Low)', key: '3', run: () => { closeModal(); setPriorityValue('3'); } },
        { label: 'Open Central Config (Labels, Components, Priorities)', key: 'g', run: () => openConfigModal() },
        { label: 'Import Excel (.xlsx) / CSV / Paste from Excel', key: 'i', run: () => openImportModal() },
        { label: 'Export & Validate Xray Cloud CSV', key: 'e', run: () => openModal('export') },
        { label: 'Add step below current row', key: 'n', run: () => { closeModal(); insertStepBelow(true); } },
        { label: 'Duplicate current step', key: 'd', run: () => { closeModal(); duplicateStep(); } },
        { label: 'Delete current step', key: 'Del', run: () => { closeModal(); deleteStep(); } },
        { label: 'Move step up', key: 'Alt+↑', run: () => { closeModal(); moveStep(-1); } },
        { label: 'Move step down', key: 'Alt+↓', run: () => { closeModal(); moveStep(1); } },
        { label: 'Move active column left', key: 'Alt+←', run: () => { closeModal(); moveColumn(-1); } },
        { label: 'Move active column right', key: 'Alt+→', run: () => { closeModal(); moveColumn(1); } },
        { label: (hidden.has('data') ? 'Show' : 'Hide') + ' column: Data', key: 'Cmd', run: () => { closeModal(); toggleStepColumn('data'); } },
        { label: 'New test case', key: 't', run: () => { closeModal(); createNewTest(); } },
        { label: 'Duplicate active test case', key: 'Shift+T', run: () => { closeModal(); duplicateTest(); } },
        { label: 'Delete active test case', key: 'Cmd', run: () => { closeModal(); deleteCurrentTest(); } },
        { label: 'Edit Test Summary', key: 's', run: () => { closeModal(); startMetaEdit('summary'); } },
        { label: 'Edit Requirement / Story Key', key: 'r', run: () => { closeModal(); startMetaEdit('requirement'); } },
        { label: 'Toggle Light / Dark Theme', key: 'Cmd', run: () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; applyTheme(); closeModal('Switched theme to ' + state.theme); } },
        { label: 'Undo last change', key: 'u / Ctrl+Z', run: () => undo() },
        { label: 'Redo change', key: 'Ctrl+Y', run: () => redo() },
        { label: 'Keyboard Shortcuts Reference', key: '?', run: () => openModal('help') }
      ];
    }

    function getFilteredCommands() {
      const q = state.paletteQuery.trim().toLowerCase();
      const cmds = getCommands();
      if (!q) return cmds;
      return cmds.filter(c => c.label.toLowerCase().includes(q) || c.key.toLowerCase().includes(q));
    }

    function openConfigModal() {
      state.configDraft = deepClone(state.config);
      setStatus('Central Config open');
      openModal('config');
    }

    function addConfigOption(field) {
      syncConfigDraftFromDom();
      const inputId = field === 'labels' ? 'cfg-add-label' : 'cfg-add-comp';
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      state.configDraft[field] = dedupeStrings([...state.configDraft[field], val]);
      inp.value = '';
      render(false);
      const nextInp = document.getElementById(inputId);
      if (nextInp) nextInp.focus();
    }

    function removeConfigOption(field, val) {
      syncConfigDraftFromDom();
      state.configDraft[field] = state.configDraft[field].filter(x => x !== val);
      render(false);
    }

    function syncConfigDraftFromDom() {
      if (!state.configDraft) return;
      const d = state.configDraft;
      const getVal = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : null;
      };
      const getChecked = (id) => {
        const el = document.getElementById(id);
        return el ? !!el.checked : false;
      };

      d.allowCustomLabels = getChecked('cfg-custom-labels');
      d.allowCustomComponents = getChecked('cfg-custom-comps');
      d.includeUtf8Bom = getChecked('cfg-utf8-bom');
      d.autoWriteCsvToFolder = getChecked('cfg-auto-csv');

      const csvDel = getVal('cfg-csv-delim');
      if (csvDel === ',' || csvDel === ';') d.csvDelimiter = csvDel;
      const listDel = getVal('cfg-list-delim');
      if (listDel !== null && listDel.trim()) d.listDelimiter = listDel.trim();
      const defPrio = getVal('cfg-default-prio');
      if (defPrio) d.defaultPriority = defPrio;

      (d.priorities || []).forEach((p, idx) => {
        const lbl = getVal(`cfg-prio-label-${idx}`);
        if (lbl !== null && lbl.trim()) p.label = lbl.trim();
      });

      Object.keys(d.headers).forEach(k => {
        const hv = getVal(`cfg-hdr-${k}`);
        if (hv !== null && hv.trim()) d.headers[k] = hv.trim();
      });
    }

    function saveConfigDraft() {
      syncConfigDraftFromDom();
      pushUndo();
      state.config = normalizeConfig(state.configDraft, BAKED_CONFIG);
      persistConfig(true);
      if (state.dirHandle) scheduleFolderSave(state.activeProjectIdx);
      clampCursor();
      closeModal(state.dirHandle ? 'Saved Central Config to browser & local folder' : 'Saved Central Config locally');
    }

    function downloadConfiguredTeamHtml() {
      syncConfigDraftFromDom();
      const nextCfg = normalizeConfig(state.configDraft, BAKED_CONFIG);
      try {
        const htmlOut = buildConfiguredHtml(PRISTINE_HTML, nextCfg);
        state.config = nextCfg;
        state.config.configVersion = nextCfg.configVersion + 1;
        state.configDraft = deepClone(state.config);
        persistConfig();
        triggerDownload('xray-test-studio-configured.html', htmlOut, 'text/html;charset=utf-8');
        setStatus('Downloaded pre-configured team HTML (v' + state.config.configVersion + ')', 'ok');
        render(false);
      } catch (err) {
        setStatus('Failed to build team HTML: ' + err.message, 'err');
        render(false);
      }
    }

    function exportConfigJson() {
      syncConfigDraftFromDom();
      triggerDownload('xray-central-config.json', JSON.stringify(state.configDraft, null, 2), 'application/json');
      setStatus('Exported central config JSON', 'ok');
      render(false);
    }

    function resetToBakedConfig() {
      pushUndo();
      state.config = deepClone(BAKED_CONFIG);
      state.configDraft = deepClone(BAKED_CONFIG);
      try { localStorage.removeItem(STORAGE_CONFIG_KEY); } catch (_e) {}
      setStatus('Reset to baked-in Central Config', 'ok');
      render(false);
    }

    function handleConfigJsonUpload(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          state.configDraft = normalizeConfig(parsed, BAKED_CONFIG);
          setStatus('Loaded config from ' + file.name + ' (click Apply to save)', 'ok');
          render(false);
        } catch (err) {
          setStatus('Invalid config JSON: ' + err.message, 'err');
          render(false);
        }
      };
      reader.readAsText(file);
    }

    /* --- Import Modal Logic --- */

    function openImportModal() {
      state.importState = {
        sourceName: '',
        sheets: [],
        sheetIdx: 0,
        rows: [],
        hasHeaderRow: true,
        mapping: null,
        error: ''
      };
      setStatus('Import Excel, CSV, JSON, or paste cells');
      openModal('import');
    }

    async function handleImportFile(file) {
      if (!file) return;
      state.importState.error = '';
      state.importState.sourceName = file.name;
      const lower = file.name.toLowerCase();

      try {
        if (lower.endsWith('.json')) {
          const text = await file.text();
          const parsedProj = parseProjectFile(text, file.name);
          const parsed = parsedProj ? parsedProj.tests : JSON.parse(text);
          if (Array.isArray(parsed)) {
            pushUndo();
            state.tests = parsed;
            state.activeTestIdx = 0;
            state.row = 0;
            state.col = 0;
            clampCursor();
            persistSuite();
            closeModal(`Loaded ${parsed.length} test(s) from ${file.name} into ${activeProject().name}`);
            return;
          }
          throw new Error('JSON file must be a project file or an array of test cases.');
        }

        if (lower.endsWith('.xlsx')) {
          const buf = await file.arrayBuffer();
          const sheets = await parseXlsxSheets(buf);
          if (sheets.length === 0) throw new Error('No worksheets found inside .xlsx file.');
          state.importState.sheets = sheets;
          state.importState.sheetIdx = 0;
          loadImportRows(sheets[0].rows);
          render(false);
          return;
        }

        const buf = await file.arrayBuffer();
        const text = decodeTextBytes(buf);
        const parsed = parseCsvText(text);
        state.importState.sheets = [{ name: 'CSV', rows: parsed.rows }];
        state.importState.sheetIdx = 0;
        loadImportRows(parsed.rows);
        render(false);
      } catch (err) {
        state.importState.error = err.message || 'Could not parse file.';
        render(false);
      }
    }

    function handlePastedImportText(text) {
      const clean = String(text || '').trim();
      if (!clean) return;
      state.importState.error = '';
      state.importState.sourceName = 'Pasted Excel / CSV cells';
      const parsed = parseCsvText(clean);
      state.importState.sheets = [{ name: 'Clipboard', rows: parsed.rows }];
      state.importState.sheetIdx = 0;
      loadImportRows(parsed.rows);
      render(false);
    }

    function loadImportRows(rows) {
      state.importState.rows = rows || [];
      if (rows.length > 0) {
        state.importState.mapping = autoMapHeaders(rows[0]);
      } else {
        state.importState.mapping = null;
        state.importState.error = 'No non-empty rows found.';
      }
    }

    function selectImportSheet(idx) {
      const sheet = state.importState.sheets[idx];
      if (!sheet) return;
      state.importState.sheetIdx = idx;
      loadImportRows(sheet.rows);
      render(false);
    }

    function updateImportMapping(field, colIdxStr) {
      if (!state.importState.mapping) return;
      state.importState.mapping[field] = Number(colIdxStr);
    }

    function executeImport(replaceSuite) {
      const imp = state.importState;
      if (!imp.rows || imp.rows.length === 0 || !imp.mapping) return;
      const imported = normalizeImportedRows(imp.rows, imp.mapping, imp.hasHeaderRow, state.config);
      pushUndo();
      if (replaceSuite) {
        state.tests = imported;
        state.activeTestIdx = 0;
      } else {
        const existingIds = new Set(state.tests.map(t => t.id));
        imported.forEach(t => {
          while (existingIds.has(t.id)) {
            t.id = 'TC-' + String(state.tests.length + 1).padStart(2, '0');
          }
          existingIds.add(t.id);
          state.tests.push(t);
        });
        state.activeTestIdx = state.tests.length - imported.length;
      }
      state.row = 0;
      state.col = 0;
      clampCursor();
      persistSuite();
      closeModal(`Imported ${imported.length} test case(s) from ${imp.sourceName}`);
    }

    /* --- Export & Quick-Fix Actions --- */

    function triggerDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadXrayCsv() {
      const csv = buildXrayCsv(state.tests, state.config);
      const payload = state.config.includeUtf8Bom ? ('\uFEFF' + csv) : csv;
      const csvName = activeProject().fileName.replace(/\.json$/i, '') + '.xray.csv';
      triggerDownload(csvName, payload, 'text/csv;charset=utf-8');
      setStatus(`Downloaded ${csvName}`, 'ok');
      render(false);
    }

    function downloadSuiteJson() {
      downloadActiveProjectJson();
    }

    function copyXrayCsv() {
      const csv = buildXrayCsv(state.tests, state.config);
      const done = () => {
        state.exportCopied = true;
        setStatus('Copied Xray Cloud CSV to clipboard', 'ok');
        render(false);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(csv).then(done).catch(() => fallbackCopy(csv, done));
      } else {
        fallbackCopy(csv, done);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        onDone();
      } finally {
        document.body.removeChild(ta);
      }
    }

    function fixUnknownTagsToConfig() {
      const issues = validateSuite(state.tests, state.config);
      const extraLabels = [];
      const extraComps = [];
      issues.forEach(iss => {
        if (iss.kind === 'labels') extraLabels.push(...iss.values);
        if (iss.kind === 'components') extraComps.push(...iss.values);
      });
      if (extraLabels.length === 0 && extraComps.length === 0) return;
      pushUndo();
      state.config.labels = dedupeStrings([...state.config.labels, ...extraLabels]);
      state.config.components = dedupeStrings([...state.config.components, ...extraComps]);
      persistConfig();
      setStatus('Added imported tags to Central Config', 'ok');
      render(false);
    }

    function stripUnknownTagsFromTests() {
      const allowedL = new Set(state.config.labels || []);
      const allowedC = new Set(state.config.components || []);
      pushUndo();
      state.tests.forEach(t => {
        if (!state.config.allowCustomLabels) t.labels = (t.labels || []).filter(l => allowedL.has(l));
        if (!state.config.allowCustomComponents) t.components = (t.components || []).filter(c => allowedC.has(c));
      });
      persistSuite();
      setStatus('Stripped unconfigured Labels/Components from tests', 'ok');
      render(false);
    }

    function renderGrid() {
      const t = activeTest();

      const headerRow = `
        <div role="row" aria-rowindex="1" class="grid-row header" style="grid-template-columns:${colTemplate}">

      `;

      const bodyRows = t.steps.map((step, rIdx) => {
        const isCurrentRow = rIdx === state.row;

            return `

    function renderExportModal() {

      const warns = issues.filter(i => i.severity === 'warn');

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Xray Cloud Export and Validation">

                : `<div class="banner ${errors.length ? 'err' : 'warn'}">
                     <span><strong>${errors.length} error(s), ${warns.length} warning(s)</strong> found across your test cases.</span>

              ${issues.length > 0 ? `
                <div style="display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto">
                  ${issues.map(iss => `
                    <button type="button" class="list-item" onclick="switchTest(${iss.testIdx});closeModal('Jumped to ${escHtml(iss.testId)}')">
                      <span style="color:var(${iss.severity === 'error' ? '--error' : '--warning'})">${escHtml(iss.message)}</span>
                      <span class="muted">Jump →</span>

              <pre class="code-box">${escHtml(csv)}</pre>

            </div>

    function getFolderPillMeta() {
      if (state.dirHandle) {
        if (state.syncStatus === 'saving') {
          return { cls: 'saving', html: `<span>●</span><span>Folder: ${escHtml(state.dirHandle.name)} · Saving…</span>` };
        }
        if (state.syncStatus === 'error') {
          return { cls: 'error', html: `<span>▲</span><span>Folder: ${escHtml(state.dirHandle.name)} · Sync error</span>` };
        }
        return { cls: 'connected', html: `<span>●</span><span>Folder: ${escHtml(state.dirHandle.name)}${state.lastSyncTime ? ' · ' + escHtml(state.lastSyncTime) : ''}</span>` };
      }
      if (state.pendingDirHandle) {
        return { cls: 'pending', html: `<span>↻</span><span>Reconnect: ${escHtml(state.pendingDirHandle.name)}</span><kbd>o</kbd>` };
      }
      if (supportsDirectorySync()) {
        return { cls: '', html: `<span>Connect Folder</span><kbd>o</kbd>` };
      }
      return { cls: '', html: `<span>Browser Storage</span><kbd>w</kbd>` };
    }

    function renderProjectsModal() {
      const pm = state.projectsModal;
      pm.idx = Math.max(0, Math.min(pm.idx, state.projects.length - 1));
      const secureSync = supportsDirectorySync();

      let folderBanner = '';
      if (state.dirHandle) {
        folderBanner = `
          <div class="banner ok">
            <div>
              <strong>Connected folder: ${escHtml(state.dirHandle.name)}</strong>
              <div class="muted" style="font-size:12px">Writes <span class="mono">central-config.json</span>, <span class="mono">&lt;project&gt;.json</span>${state.config.autoWriteCsvToFolder ? ', and <span class="mono">&lt;project&gt;.xray.csv</span>' : ''} directly to disk.</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" onclick="rescanConnectedFolder()">Rescan <kbd>f</kbd></button>
              <button type="button" onclick="connectLocalFolder(true)">Change Folder <kbd>o</kbd></button>
              <button type="button" class="danger" onclick="disconnectLocalFolder()">Disconnect</button>
            </div>
          </div>
        `;
      } else if (state.pendingDirHandle) {
        folderBanner = `
          <div class="banner warn">
            <span>Previously linked folder <strong>${escHtml(state.pendingDirHandle.name)}</strong> needs permission after reload.</span>
            <div style="display:flex;gap:6px">
              <button type="button" class="primary" onclick="connectLocalFolder(false)">Reconnect Folder <kbd>o</kbd></button>
              <button type="button" onclick="connectLocalFolder(true)">Pick Different Folder</button>
            </div>
          </div>
        `;
      } else if (secureSync) {
        folderBanner = `
          <div class="banner">
            <span>No local folder connected yet (currently saving to Browser Storage). Connect a local or OneDrive-synced folder to persist projects as <span class="mono">.json</span> files.</span>
            <button type="button" class="primary" onclick="connectLocalFolder(true)">Connect Local Folder <kbd>o</kbd></button>
          </div>
        `;
      } else {
        folderBanner = `
          <div class="banner warn">
            <span>Opened via <span class="mono">file://</span> — Chromium blocks <span class="mono">showDirectoryPicker()</span> on local file URLs. Host this file on <span class="mono">https://*.github.io</span> or <span class="mono">http://localhost</span> to unlock direct local folder read/write. Browser Storage and <span class="mono">.json</span> import/export work normally here.</span>
          </div>
        `;
      }

      const formBox = (pm.submode === 'new' || pm.submode === 'rename')
        ? `
          <div class="section-box" style="border-color:var(--primary)">
            <div style="font-weight:700">${pm.submode === 'new' ? 'Create New Project' : 'Rename Project'}</div>
            <div style="display:grid;grid-template-columns:1fr 140px auto auto;gap:8px;align-items:center">
              <input id="proj-name-input" type="text" value="${escHtml(pm.draftName)}" placeholder="Project name (e.g. Checkout Redesign)" />
              <input id="proj-key-input" type="text" value="${escHtml(pm.draftKey)}" placeholder="Jira key (SHOP)" class="mono" />
              <button type="button" class="primary" onclick="submitProjectForm()">Save <kbd>Enter</kbd></button>
              <button type="button" onclick="state.projectsModal.submode='list';render(true)">Cancel <kbd>Esc</kbd></button>
            </div>
          </div>
        `
        : '';

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Projects and Local Folder Workspace">
          <div class="modal-card wide">
            <div class="modal-head">
              <span class="modal-title">Projects &amp; Local Folder Workspace (${state.projects.length})</span>
              <button type="button" onclick="closeModal('Closed projects')">Close <kbd>Esc</kbd></button>
            </div>
            <div class="modal-body">
              ${folderBanner}
              ${formBox}
              <div id="projects-list-focus" tabindex="-1" style="display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;outline:none">
                ${state.projects.map((p, idx) => {
                  const isActive = idx === state.activeProjectIdx;
                  const hl = idx === pm.idx;
                  return `
                    <button
                      id="proj-item-${idx}"
                      type="button"
                      tabindex="-1"
                      onclick="state.projectsModal.idx=${idx};switchProject(${idx}, true)"
                      class="list-item ${hl ? 'highlighted' : ''}"
                    >
                      <div style="display:flex;align-items:center;gap:8px;min-width:0">
                        <span class="mono" style="font-weight:700;color:var(${isActive ? '--success' : '--text-faint'})">${isActive ? '●' : '○'}</span>
                        <span style="font-weight:700">${escHtml(p.name)}</span>
                        ${p.jiraProjectKey ? `<span class="chip comp mono">${escHtml(p.jiraProjectKey)}</span>` : ''}
                        <span class="mono faint" style="font-size:12px">${escHtml(p.fileName)}</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
                        <span class="muted">${(p.tests || []).length} test(s)</span>
                        ${hl ? '<kbd>Enter</kbd>' : ''}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="modal-foot">
              <div class="hints">
                <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
                <span><kbd>Enter</kbd> Open</span>
                <span><kbd>n</kbd> New</span>
                <span><kbd>r</kbd> Rename</span>
                <span><kbd>d</kbd> Duplicate</span>
                <span><kbd>Del</kbd> Delete</span>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <label style="display:inline-flex">
                  <input type="file" accept=".json" style="display:none" onchange="importProjectJsonFile(this.files[0])" />
                  <span style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);cursor:pointer">Import Project .json</span>
                </label>
                <button type="button" onclick="downloadActiveProjectJson()">Export Active .json</button>
                <button type="button" class="primary" onclick="startProjectForm('new')">+ New Project <kbd>n</kbd></button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function startProjectForm(submode) {
      const pm = state.projectsModal;
      const proj = state.projects[pm.idx];
      pm.submode = submode;
      if (submode === 'rename' && proj) {
        pm.draftName = proj.name;
        pm.draftKey = proj.jiraProjectKey || '';
      } else {
        pm.draftName = '';
        pm.draftKey = '';
      }
      render(true);
    }

    function submitProjectForm() {
      const nameVal = document.getElementById('proj-name-input')?.value || '';
      const keyVal = document.getElementById('proj-key-input')?.value || '';
      if (!nameVal.trim()) {
        setStatus('Project name cannot be empty', 'warn');
        render(true);
        return;
      }
      if (state.projectsModal.submode === 'new') {
        createProject(nameVal, keyVal);
      } else if (state.projectsModal.submode === 'rename') {
        renameProject(state.projectsModal.idx, nameVal, keyVal);
      }
    }

      const row = (k, desc) => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0">
          <span class="muted">${desc}</span>
          <kbd>${k}</kbd>
        </div>
      `;
      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Keyboard Shortcuts">
          <div class="modal-card">
            <div class="modal-head">
              <span class="modal-title">Keyboard-Only Shortcuts</span>
              <button type="button" onclick="closeModal('Closed shortcuts')">Close <kbd>Esc</kbd></button>
            </div>
            <div class="modal-body">
              <div class="two-col">
                <div class="section-box">
                  <div style="font-weight:700">Grid Navigation &amp; Step Editing</div>
                  ${row('↑ ↓ ← →', 'Move cell focus')}
                  ${row('Enter / F2', 'Edit active cell')}
                  ${row('Tab / Shift+Tab', 'Save &amp; advance cell (auto-adds step at end)')}
                  ${row('Shift+Enter', 'New line inside cell while editing')}
                  ${row('n / Ctrl+Enter', 'Insert step below &amp; edit')}
                  ${row('d / Del', 'Duplicate / delete active step')}
                  ${row('Alt+↑ / Alt+↓', 'Move step up / down')}
                  ${row('Alt+← / Alt+→', 'Rearrange active column left / right')}
                </div>
                <div class="section-box">
                  <div style="font-weight:700">Projects, Fields &amp; Export</div>
                  ${row('w / o', 'Projects manager / Connect local folder')}
                  ${row('1 / 2 / 3 or p', 'Set Priority 1, 2, or 3')}
                  ${row('l / c', 'Open Labels / Components picker')}
                  ${row('s / r', 'Edit Summary / Requirement key')}
                  ${row('[ / ] / t', 'Prev / next / new test case')}
                  ${row('u / Ctrl+Y', 'Undo / Redo')}
                  ${row('Ctrl+S', 'Save to folder (or download .json)')}
                  ${row('/ · g · i · e', 'Palette · Config · Import · Export CSV')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderModal() {
      if (state.modal === 'labels' || state.modal === 'components') return renderPickerModal();
      if (state.modal === 'palette') return renderPaletteModal();
      if (state.modal === 'config') return renderConfigModal();
      if (state.modal === 'import') return renderImportModal();
      if (state.modal === 'export') return renderExportModal();
      if (state.modal === 'projects') return renderProjectsModal();
      if (state.modal === 'help') return renderHelpModal();
      return '';
    }

    function renderFooterHints() {
      if (state.mode === 'edit') {
        return '<span><kbd>Tab</kbd> Next cell / new step</span><span><kbd>Shift+Enter</kbd> New line</span><span><kbd>Enter</kbd> Save</span><span><kbd>Esc</kbd> Cancel</span>';
      }
      if (state.mode === 'summary' || state.mode === 'requirement') {
        return '<span><kbd>Enter</kbd> Save field</span><span><kbd>Esc</kbd> Cancel</span>';
      }
      return '<span><kbd>Arrows</kbd> Move</span><span><kbd>Enter</kbd> Edit</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Priority</span><span><kbd>l</kbd> Labels</span><span><kbd>c</kbd> Components</span><span><kbd>w</kbd> Projects</span><span><kbd>o</kbd> Folder</span><span><kbd>/</kbd> Cmds</span>';
    }

    function onCellClick(r, c) {
      if (state.mode === 'nav' && state.row === r && state.col === c) {
        startCellEdit();
        return;
      }
      if (state.mode === 'edit') {
        commitCellEdit('stay');
      }
      state.row = r;
      state.col = c;
      state.mode = 'nav';
      render(true);
    }

    function restoreFocus() {
      if (state.mode === 'modal') {
        if (state.modal === 'palette') document.getElementById('palette-input')?.focus();
        else if (state.modal === 'labels' || state.modal === 'components') document.getElementById('picker-filter')?.focus();
        else if (state.modal === 'config') document.getElementById('cfg-add-label')?.focus();
        else if (state.modal === 'import') document.getElementById('import-paste-box')?.focus();
        else if (state.modal === 'projects') {
          if (state.projectsModal.submode === 'new' || state.projectsModal.submode === 'rename') {
            document.getElementById('proj-name-input')?.focus();
          } else {
            document.getElementById('projects-list-focus')?.focus({ preventScroll: true });
            document.getElementById(`proj-item-${state.projectsModal.idx}`)?.scrollIntoView({ block: 'nearest' });
          }
        }
        else document.querySelector('.modal-card button')?.focus();
        return;
      }
      if (state.mode === 'edit') {
        const ta = document.getElementById('cell-textarea');
        if (ta) {
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
        return;
      }
      if (state.mode === 'summary' || state.mode === 'requirement') {
        const inp = document.getElementById('meta-inline-input');
        if (inp) {
          inp.focus();
          inp.select();
        }
        return;
      }
      const cell = document.getElementById(`cell-${state.row}-${state.col}`);
      if (cell) {
        cell.focus({ preventScroll: true });
        cell.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }

    function render(shouldFocus = false) {
      clampCursor();
      const proj = activeProject();
      const folderMeta = getFolderPillMeta();
      const modePillClass = state.mode === 'edit' || state.mode === 'summary' || state.mode === 'requirement'
        ? 'edit'
        : (state.mode === 'modal' ? 'modal' : '');
      const modeText = state.mode === 'modal'
        ? state.modal.toUpperCase()
        : (state.mode === 'nav' ? 'NAVIGATE' : 'EDITING');

      const app = document.getElementById('app');
      app.innerHTML = `
        <header class="topbar">
          <div class="brand">
            <span class="brand-title">Xray Cloud Test Studio</span>
            <button type="button" tabindex="-1" onclick="openProjectsModal()" title="Switch or manage projects (w)">
              <span class="muted">Project:</span>
              <strong>${escHtml(proj.name)}</strong>
              <kbd>w</kbd>
            </button>
            <button id="folder-pill" type="button" tabindex="-1" class="folder-pill ${folderMeta.cls}" onclick="state.dirHandle ? openProjectsModal() : connectLocalFolder(false)" title="Connect or inspect local folder (o)">
              ${folderMeta.html}
            </button>
            <span class="mode-pill ${modePillClass}">${modeText}</span>
          </div>
          <div class="top-actions">
            <button type="button" tabindex="-1" onclick="openPalette()">Commands <kbd>/</kbd></button>
            <button type="button" tabindex="-1" onclick="openImportModal()">Import <kbd>i</kbd></button>
            <button type="button" tabindex="-1" onclick="openConfigModal()">Central Config <kbd>g</kbd></button>
            <button type="button" tabindex="-1" class="primary" onclick="openModal('export')">Export CSV <kbd>e</kbd></button>
            <button type="button" tabindex="-1" onclick="openModal('help')">Keys <kbd>?</kbd></button>
          </div>
        </header>

        <div class="workspace">
          ${renderSidebar()}
          <main class="main-pane">
            ${renderMetaPanel()}
            ${renderGrid()}
          </main>
        </div>

        <footer class="footer">
          <div class="hints">${renderFooterHints()}</div>
          <div role="status" aria-live="polite" class="status-msg ${state.statusTone}">${escHtml(state.statusMsg)}</div>
        </footer>

        ${state.mode === 'modal' ? renderModal() : ''}
      `;

      if (shouldFocus) restoreFocus();
    }

    /* =========================================================================
       GLOBAL KEYBOARD HANDLER
       ========================================================================= */

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      const lower = key.toLowerCase();

      if ((e.ctrlKey || e.metaKey) && lower === 's') {
        e.preventDefault();
        if (state.dirHandle) flushFolderSave();
        else downloadActiveProjectJson();
        return;
      }

      if (state.mode === 'modal') {
        if (state.modal === 'projects') {
          const pm = state.projectsModal;
          if (pm.submode === 'new' || pm.submode === 'rename') {
            if (key === 'Escape') {
              e.preventDefault();
              pm.submode = 'list';
              render(true);
            } else if (key === 'Enter') {
              e.preventDefault();
              submitProjectForm();
            }
            return;
          }
          if (key === 'Escape') {
            e.preventDefault();
            closeModal('Closed projects');
          } else if (key === 'ArrowDown') {
            e.preventDefault();
            pm.idx = (pm.idx + 1) % state.projects.length;
            render(true);
          } else if (key === 'ArrowUp') {
            e.preventDefault();
            pm.idx = (pm.idx - 1 + state.projects.length) % state.projects.length;
            render(true);
          } else if (key === 'Enter') {
            e.preventDefault();
            switchProject(pm.idx, true);
          } else if (lower === 'n') {
            e.preventDefault();
            startProjectForm('new');
          } else if (lower === 'r') {
            e.preventDefault();
            startProjectForm('rename');
          } else if (lower === 'd') {
            e.preventDefault();
            duplicateProjectAt(pm.idx);
          } else if (key === 'Delete' || key === 'Backspace') {
            e.preventDefault();
            deleteProjectAt(pm.idx);
          } else if (lower === 'f' && state.dirHandle) {
            e.preventDefault();
            rescanConnectedFolder();
          } else if (lower === 'o') {
            e.preventDefault();
            connectLocalFolder(true);
          }
          return;
        }

        if (key === 'Escape') {
          e.preventDefault();
          closeModal('Closed dialog');
          return;
        }
        if (state.modal === 'palette') {
          const cmds = getFilteredCommands();
          if (key === 'ArrowDown') {
            e.preventDefault();
            if (cmds.length) {
              state.paletteIdx = (state.paletteIdx + 1) % cmds.length;
              renderPaletteListOnly();
              document.getElementById(`pal-item-${state.paletteIdx}`)?.scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'ArrowUp') {
            e.preventDefault();
            if (cmds.length) {
              state.paletteIdx = (state.paletteIdx - 1 + cmds.length) % cmds.length;
              renderPaletteListOnly();
              document.getElementById(`pal-item-${state.paletteIdx}`)?.scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'Enter' && cmds[state.paletteIdx]) {
            e.preventDefault();
            cmds[state.paletteIdx].run();
          }
          return;
        }
        if (state.modal === 'labels' || state.modal === 'components') {
          const opts = getPickerOptions();
          if (key === 'ArrowDown') {
            e.preventDefault();
            if (opts.length) {
              state.picker.idx = (state.picker.idx + 1) % opts.length;
              renderPickerListOnly();
            }
          } else if (key === 'ArrowUp') {
            e.preventDefault();
            if (opts.length) {
              state.picker.idx = (state.picker.idx - 1 + opts.length) % opts.length;
              renderPickerListOnly();
            }
          } else if (key === ' ' && (e.ctrlKey || document.activeElement?.id !== 'picker-filter' || state.picker.filter === '')) {
            e.preventDefault();
            if (opts[state.picker.idx]) togglePickerOption(opts[state.picker.idx]);
          } else if (key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            addCustomPickerValue();
          } else if (key === 'Enter') {
            e.preventDefault();
            applyPickerSelection();
          }
          return;
        }
        if (state.modal === 'export') {
          if (lower === 'c' && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            copyXrayCsv();
          } else if (lower === 'd' && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            downloadXrayCsv();
          }
          return;
        }
        if (state.modal === 'help' && key === '?') {
          e.preventDefault();
          closeModal('Closed shortcuts');
        }
        return;
      }

      if (state.mode === 'edit') {
        if (key === 'Escape') {
          e.preventDefault();
          state.mode = 'nav';
          setStatus('Cancelled cell edit');
          render(true);
        } else if (key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          commitCellEdit('newStep');
        } else if (key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          commitCellEdit('enter');
        } else if (key === 'Tab') {
          e.preventDefault();
          commitCellEdit(e.shiftKey ? 'tabPrev' : 'tabNext');
        }
        return;
      }

      if (state.mode === 'summary' || state.mode === 'requirement') {
        if (key === 'Enter') {
          e.preventDefault();
          commitMetaEdit();
        } else if (key === 'Escape') {
          e.preventDefault();
          state.mode = 'nav';
          setStatus('Cancelled field edit');
          render(true);
        }
        return;
      }

      // NAVIGATE mode
      const t = activeTest();
      const cols = getVisibleStepColumns(state.config);

      if ((e.ctrlKey || e.metaKey) && lower === 'k') { e.preventDefault(); openPalette(); }
      else if ((e.ctrlKey || e.metaKey) && lower === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && (lower === 'y' || (e.shiftKey && lower === 'z'))) { e.preventDefault(); redo(); }
      else if ((e.ctrlKey || e.metaKey) && lower === 'e') { e.preventDefault(); openModal('export'); }
      else if ((e.ctrlKey || e.metaKey) && lower === 'i') { e.preventDefault(); openImportModal(); }
      else if ((e.ctrlKey || e.metaKey) && key === ',') { e.preventDefault(); openConfigModal(); }
      else if (key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); insertStepBelow(true); }
      else if (e.altKey && key === 'ArrowUp') { e.preventDefault(); moveStep(-1); }
      else if (e.altKey && key === 'ArrowDown') { e.preventDefault(); moveStep(1); }
      else if (e.altKey && key === 'ArrowLeft') { e.preventDefault(); moveColumn(-1); }
      else if (e.altKey && key === 'ArrowRight') { e.preventDefault(); moveColumn(1); }
      else if (key === 'ArrowUp') { e.preventDefault(); if (state.row > 0) state.row--; render(true); }
      else if (key === 'ArrowDown') { e.preventDefault(); if (state.row + 1 < t.steps.length) state.row++; render(true); }
      else if (key === 'ArrowLeft') { e.preventDefault(); if (state.col > 0) state.col--; render(true); }
      else if (key === 'ArrowRight') { e.preventDefault(); if (state.col + 1 < cols.length) state.col++; render(true); }
      else if (key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) {
          if (state.col > 0) state.col--;
          else if (state.row > 0) { state.row--; state.col = cols.length - 1; }
        } else {
          if (state.col + 1 < cols.length) state.col++;
          else if (state.row + 1 < t.steps.length) { state.row++; state.col = 0; }
        }
        render(true);
      }
      else if (key === 'Enter' || key === 'F2') { e.preventDefault(); startCellEdit(); }
      else if (key === '1' || key === '2' || key === '3') { e.preventDefault(); setPriorityValue(key); }
      else if (lower === 'p') { e.preventDefault(); cyclePriority(); }
      else if (lower === 'l') { e.preventDefault(); openPicker('labels'); }
      else if (lower === 'c') { e.preventDefault(); openPicker('components'); }
      else if (lower === 's') { e.preventDefault(); startMetaEdit('summary'); }
      else if (lower === 'r') { e.preventDefault(); startMetaEdit('requirement'); }
      else if (lower === 'g') { e.preventDefault(); openConfigModal(); }
      else if (lower === 'w') { e.preventDefault(); openProjectsModal(); }
      else if (lower === 'o') { e.preventDefault(); connectLocalFolder(false); }
      else if (lower === 'i') { e.preventDefault(); openImportModal(); }
      else if (lower === 'e') { e.preventDefault(); openModal('export'); }
      else if (key === '/') { e.preventDefault(); openPalette(); }
      else if (key === '?') { e.preventDefault(); openModal('help'); }
      else if (lower === 'n') { e.preventDefault(); insertStepBelow(true); }
      else if (lower === 'd') { e.preventDefault(); duplicateStep(); }
      else if (key === 'Delete' || key === 'Backspace') { e.preventDefault(); deleteStep(); }
      else if (key === 'T' && e.shiftKey) { e.preventDefault(); duplicateTest(); }
      else if (lower === 't') { e.preventDefault(); createNewTest(); }
      else if (key === '[') { e.preventDefault(); switchTest((state.activeTestIdx - 1 + state.tests.length) % state.tests.length); }
      else if (key === ']') { e.preventDefault(); switchTest((state.activeTestIdx + 1) % state.tests.length); }
      else if (lower === 'u') { e.preventDefault(); undo(); }
    });

    applyTheme();
    render(true);
    initPersistedFolder();
  </script>
</body>
</html>
